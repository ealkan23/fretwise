# Publishes the app to GitHub Pages on every push to main: src/fretwise.html becomes index.html, piano/ sits beside it.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp src/fretwise.html _site/index.html && cp -r piano _site/piano && cp -r vendor _site/vendor
      - run: sed -i "s/const BUILD='dev'/const BUILD='${GITHUB_SHA::7}'/" _site/index.html && grep -c "const BUILD='${GITHUB_SHA::7}'" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
