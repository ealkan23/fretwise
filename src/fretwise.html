 fretboard:{how:['Learn strings 6 and 5 first: every barre chord, shell voicing and walking line takes its root from them.','Say the note name out loud before you answer. The mouth teaches the hand.','Check yourself with an octave shape instead of counting up from the nut.','Accuracy first; the speed comes by itself after a week of short daily rounds.'],
  rules:['Open strings, low to high: <b>E A D G B E</b>.','Fret 12 is the open string an octave up; the dots at 3, 5, 7, 9 and 12 are your landmarks.','Natural notes are two frets apart, except <b>B–C</b> and <b>E–F</b>, which are one fret apart.','Fret 5 is the next string up open, except on string 3, where it is fret 4.','Octave shape: two strings up and two frets up; three frets up when you cross onto the B string.','A sharp is one fret up, a flat one fret down: one fret, two names (C♯ = D♭).'],
  take:'Note names are the vocabulary of everything else: chord roots, targets for lines, the anchor for every shape. When you stop counting frets, you start seeing music on the neck.'},
 sight:{how:['Name the note on the staff first (letter and octave), then play it. Never guess by shape.','Learn the staff landmarks (middle C, G on the 2nd line, the top F) and read from them.','Stay in the position the level gives you and let the fingers find the note; do not chase it up the neck.','Read one note ahead: while you play this note, look at the next. Ten minutes a day beats an hour once a week.'],
  rules:['Treble lines <b>E G B D F</b>, spaces <b>F A C E</b>; ledger lines continue the alternation.','Guitar is written an octave higher than it sounds; written middle C (first ledger line below) is string 5, fret 3.','Open strings on the staff: low E below the third ledger line, A on the second ledger line, D just below the staff, G on the 2nd line, B on the middle line, high E in the top space.','Order of sharps <b>F C G D A E B</b>, flats <b>B E A D G C F</b>. A key signature lasts the whole piece; an accidental lasts to the end of the bar.','In a position each finger covers one fret; the index finger names the position.'],
  take:'Reading in position is how jazz guitarists play from a chart: the staff becomes fingering without thinking, so your attention can go to time and phrasing.'},
 hunt:{how:['Go string by string, lowest string first, and check each spot with the octave shape before you play it.','Name the octave as you play (D3, D4, D5): you are mapping registers, not just frets.','Mute each note before the next so every spot is clear.','When string by string is easy, play it fret by fret (level 6): the same notes, seen across the neck.'],
  rules:['Every note lives once on each string between frets 1 and 11; a string’s own open note also sits at fret 0 and 12.','Octave shape: two strings over and two frets up (three frets when crossing onto the B string).','Strings 6 and 1 are both E: the same fret on both is the same note two octaves apart.','A note on string 6 is also 5 frets lower on string 5 (the same pitch), 4 frets lower when moving from string 3 to string 2.'],
  take:'The octave map behind every scale and chord shape. Once you see all the Cs at once, any C chord or C scale has a home anywhere on the neck.'},
 triads:{how:['Find the root first, then name the inversion from what is in the bass.','Root position first: major, then minor (lower the 3rd one fret) on the top two string sets, then on all four; only then the inversions, one at a time.','Play each shape on your guitar and say the chord tone under each finger, low to high.','Move one key up the neck in inversions: root position, 1st, 2nd, then the next root position.'],
  rules:['From notes: name the chord, then the inversion by the bass. A slash chord C/E is C major with E in the bass (1st inversion).','Root position: root in the bass (1 3 5). 1st inversion: 3rd in the bass (3 5 1). 2nd inversion: 5th in the bass (5 1 3).','Root position: the root is the lowest note. 1st inversion: the root is on top. 2nd inversion: the root is in the middle.','Major to minor: lower the 3rd one fret. Diminished: lower the 3rd and 5th. Augmented: raise the 5th.','On a string set that includes the B string, the shape bends by one fret at that string.','A major 3rd on the bottom: major in root position or minor in 1st inversion. Check the other 3rd.'],
  take:'Triads are the most useful chords on the guitar: compact comping, melodic chord lines and, later, upper structures over dominant chords.'},
 intervals:{how:['Spell the major scale of every key first: a key signature is nothing but that scale’s sharps or flats, and every interval is measured against it.','Count the letters first (a 3rd always spans three letters), then fix the accidental.','Measure every interval against the major scale of the bottom note.','Say keys around the circle of fifths every day until the key signatures are automatic.'],
  rules:['From the major scale: 2nds, 3rds, 6ths and 7ths are major; unisons, 4ths, 5ths and octaves are perfect.','One half step smaller: major → minor → diminished; perfect → diminished. One larger: major or perfect → augmented.','Sharps: <b>F C G D A E B</b>; the key is a half step above the last sharp.','Flats: <b>B E A D G C F</b>; the key is the second-to-last flat (F major has one flat).','Relative minor: down a minor 3rd, same key signature. Parallel minor: same root.','Harmonic minor raises the 7th; melodic minor raises the 6th and 7th. Inverted intervals add up to 9: major ↔ minor, augmented ↔ diminished, perfect stays perfect.'],
  take:'Intervals are the measuring stick of all harmony. Chords, scales and voicings are just intervals stacked from a root.'},
 spelling:{how:['Learn the twelve major triads by heart first, saying them around the cycle of fourths: C F B♭ E♭ A♭ D♭ G♭ B E A D G.','Then get every other chord by alteration, not by counting from scratch.','Say each spelling out loud as you type it; aim for under 3 seconds per chord.'],
  rules:['Every triad uses three alternate letters: C-E-G, D-F-A, E-G-B, F-A-C, G-B-D, A-C-E, B-D-F.','Major triads: C, F, G all natural; D, E, A sharp the 3rd; B sharps the 3rd and 5th; the flat roots follow their key signatures (B♭ D F, E♭ G B♭, A♭ C E♭, D♭ F A♭, G♭ B♭ D♭).','Minor: lower the 3rd. Diminished: lower the 3rd and 5th. Augmented: raise the 5th.','Major 7th: a half step below the root. ♭7: a whole step below the root. 6th: a whole step above the 5th.','maj7 = major + 7; 7 = major + ♭7; m7 = minor + ♭7; m7♭5 = diminished + ♭7; dim7 = diminished + 𝄫7.'],
  take:'Chord spelling is the alphabet of jazz harmony. When the spelling just appears, you can think about voice leading and melody instead of arithmetic.'},
 drop2:{how:['Learn the four inversions of Cmaj7 on strings 2–5 first; everything else is a small change from them.','Name each grip “from close”: which close inversion it was dropped from.','Play the II–V–I combos from your sheet slowly, holding common tones.'],
  rules:['Seventh chords have four positions: root, 1st (3rd in the bass), 2nd (5th), 3rd (7th in the bass, e.g. C7/B♭).','On the neck: find the root first (it is not always the lowest string), then the 3rd and the 7th.','Drop-2 lowers the second voice from the top of a close voicing by an octave.','Quality changes move single notes: maj7 → 7 lowers the 7th one fret; 7 → m7 lowers the 3rd one fret; m7 → m7♭5 lowers the 5th.','Each chord has four inversions on each string set; the top note is the one you hear as melody.','In II–V–I, voices move by step or hold: the 7th of each chord falls to the 3rd of the next.'],
  take:'Drop-2 is the standard four-note comping and chord-melody voicing. With four inversions per set you can play any chord under any melody note.'},
 scales:{how:['Index finger pinned at the position fret; the 4th-finger stretch is a tool, not a problem.','Strict alternate picking, with the click. Quarter notes, then eighths, then triplets at the same tempo.','From the lowest note of the position to the highest: not from the root.','Patterns before pairs: a new pattern in a known shape is harder than a known pattern in a new shape.'],
  rules:['Seven positions of one key cover the neck: II, III, V, VII, VIII, X, XII in C.','The shapes come in pairs with the same anchor finger: one with the anchor on the A string, one on the E string.','A-string shape then E-string shape at the same fret moves the key up a fifth: that is the circle on the guitar.','Thirds, triads and sevenths through the scale are the chords of the key sitting inside it.','A mode is a choice of home note inside a position you already own; only “one root, seven modes” changes the shape.'],
  take:'The neck is seven windows. Any melody in any key can be played in any of them without shifting; the patterns are the harmony, and the alternating versions are the technique.'},
 tgrips:{how:['Never learn a tension chord as a new grip: start from the plain 7th-chord shape and move one finger.','Say the interval under each finger out loud: R, 3, ♭7, 9.','Drop the 5th first when you need a finger for a tension, then the root.','Play each one in a II–V–I straight away: a colour means nothing alone.'],
  rules:['V7 going to a major chord takes natural tensions: 9, 13.','V7 going to a minor chord takes altered tensions: ♭9, ♯9, ♯5.','A dominant that does not resolve takes 9, 13 or ♯11.','Tonic major: Maj7, 6, 6/9 and maj9 are interchangeable. Tonic minor: m6, m(maj7), m6/9.','Never a natural 11 on a dominant that has its 3rd: that is what sus4 is for.'],
  take:'If a chart says G7, a jazz player hears G9 or G13. The tensions are small moves from shapes you know; the system is the shape, the colour is one finger.'},
 tunes:{how:['Sing the phrase before you touch the guitar: if you can sing it, you can find it.','Find the first note against the key chord, then follow the shape: step, leap, repeat.','Do not look for the notes one by one: hear the phrase as two or three gestures.','When a tune is easy in one key, play it in another the same day.'],
  rules:['Most melodies move by step; the leaps are between 1, 3 and 5.','A phrase usually ends on 1, 3 or 5 (rest) or on 2 or 7 (wants to go on).','The same phrase in another key is the same degrees: think numbers, not letters.','A repeated note counts once here; the rhythm is yours to keep.'],
  take:'A musician carries a book of tunes in the ear. Every tune you can play back in any key makes the next one easier: they are built from the same moves.'},
 improv:{how:['Play the example idea first: the 3rd on beat 1 and up the scale. Then change one note.','Say the chord tones aloud before the count-in; aim at one of them for each bar line.','Keep going through a wrong note: the next strong beat is the next chance.','Sing a line, then play what you sang: that is improvising, the rest is finger habit.'],
  rules:['Chord tones (1 3 5 7) on the strong beats make a line sound like its chord.','The 3rd and the 7th are the guide tones: the 7th of one chord falls to the 3rd of the next.','Between chord tones, use the chord’s scale; a note outside it must step a half step into the next note.','Never the same note twice in a row here: a line moves.'],
  take:'Improvising is choosing among notes you already know, in time. The rules here are the ones every good line keeps; inside them, everything you play is yours.'},
 outer:{how:['Hum the lowest note of each chord first: the bass gives the numeral.','Then hum the highest note: that is the melody the chord carries.','Name the top note twice: as a degree of the key, and as what it is to its chord (3rd, 7th, 9th…).','Bass and top move against each other: when they go in opposite directions the progression sings.'],
  rules:['The bass is the root most of the time; when it is not, you hear an inversion.','Chord tones on top sound settled; tensions (9, 11, 13) float and want to move.','A 9th is a 2nd an octave up, an 11th a 4th, a 13th a 6th: hear tensions as intervals from the root.','The outer voices are what a listener hears first: melody and bass, soprano and bass.'],
  take:'Hearing the outer voices is how you follow a song you have never seen: the bass tells you the chords, the top tells you the melody’s place in them.'},
 earmode:{how:['First decide: is the 3rd major or minor? That halves the choices.','Then hunt for the one note that is not where plain major or minor puts it: ♯4, ♭2, ♭7, a natural 6 in minor.','In a vamp, hear the first chord as home and ask what notes the second chord adds.','When one chord in a phrase sounds darker, a note was borrowed from the parallel minor: find it.'],
  rules:['Ionian: major. Lydian: major with ♯4. Mixolydian: major with ♭7.','Aeolian: natural minor. Dorian: minor with a natural 6. Phrygian: minor with ♭2. Locrian: ♭2 and ♭5.','Each mode has one colour note; the rest is major or minor.','Borrowed chords (IVm, ♭VII, ♭VI, IIm7♭5, ♭III) bring ♭3, ♭6 or ♭7 into a major key.'],
  take:'Modes are colours: once you can hear which note makes the colour, you can hear a tune change mode on one chord, and play that note on purpose.'},
 eardeg:{how:['After the cadence, sing the tonic before you answer.','Walk up or down the scale from the tonic to the note, in your head or out loud.','Feel the pull: each degree has its own tension.'],
  rules:['1 is home; 3 and 5 are stable; 2, 4 and 6 lean on their neighbours.','7 pulls up to 1; 4 pulls down to 3; 6 falls to 5; 2 resolves to 1 or 3.','♭3 and ♭7 are the blue notes; ♯4 leans hard up to 5.','In minor, 3 is ♭3 and 6 is ♭6; a raised 7 means harmonic minor.'],
  take:'Hearing degrees is the core of playing by ear: once you know where a note sits in the key, you can play what you hear.'},
 eariv:{how:['Use a song you know for each interval, then let the songs fade as the sounds become familiar.','Sing both notes back before answering.','Harmonic intervals: hum the lower note, then find the upper one.'],
  rules:['Reference starts: m2 <i>Jaws</i> · M2 <i>Happy Birthday</i> · m3 <i>Greensleeves</i> · M3 <i>When the Saints</i> · P4 <i>Here Comes the Bride</i> · tritone <i>Maria</i> · P5 <i>Twinkle Twinkle</i> · M6 <i>My Bonnie</i> · m7 <i>Somewhere</i> · octave <i>Over the Rainbow</i>.','Consonant: 3rds, 6ths, perfect 4th, 5th, octave. Dissonant: 2nds, 7ths, tritone.','Falling intervals feel different: practise them as their own sounds.'],
  take:'Intervals are the distance between any two notes you hear: the raw material for transcribing lines and voicings.'},
 earchord:{how:['Listen for the 3rd first (major or minor), then the 7th.','Sing the chord from the root up, one note at a time.','Compare: play two qualities back to back on the guitar until the difference is obvious.'],
  rules:['Major: bright and stable. Minor: dark. Diminished: tense and small. Augmented: open and unresolved.','maj7: soft with a rub (the 7 a half step below the root). 7: bluesy, wants to resolve. m7: mellow. m7♭5: dark and unsettled. dim7: symmetrical, could go anywhere.','Sus chords have no 3rd: neither major nor minor.'],
  take:'Chord quality by ear is how you comp what you hear and recognise what a pianist or record is playing.'},
 earprog:{how:['Follow the bass line first; the roots tell most of the story.','Hear where the music resolves to I; count back from there.','Sing the roots as numbers along with the progression.'],
  rules:['II–V–I: roots 2–5–1, each a fourth up (or fifth down).','A tritone sub moves the bass down by half steps: ♭II7 → I.','Backdoor: IVm7 – ♭VII7 – IMaj7, the dominant rises a whole step into I.','Twelve-bar blues: I IV I I · IV IV I I · V IV I V; the jazz blues adds II–Vs and VI7.'],
  take:'Hearing progressions is how you learn tunes by ear and follow the band when the changes go somewhere new.'},
 guidetones:{how:['Find the root in the position first; place the 3rd and 7th from it.','Say “3” and “7” as you mark them; then the 5th and root.','Look for the closest 3rd and 7th to where your hand already is.'],
  rules:['The 3rd and 7th define the chord: maj7 (3, 7), 7 (3, ♭7), m7 (♭3, ♭7), m7♭5 (♭3, ♭5, ♭7).','The 7th is a half step (maj7) or whole step (♭7) below the root’s octave.','From the root, on the next string up: one fret back is the major 3rd, two frets back the minor 3rd (add one fret when crossing onto the B string: same fret = M3).'],
  take:'Guide tones are the notes that outline the harmony. Targeting them is how solos sound like the changes, and they are the basis of every comping shell.'},
 neckiv:{how:['Learn each interval as a shape from the starting note, not a fret count.','Say the interval name as you click.','Use them to hear lines: play the interval after you mark it.'],
  rules:['Next string up (not onto the B string): same fret = P4, one fret back = M3, two back = m3, one up = tritone, two up = P5.','Crossing onto the B string: add one fret to every shape.','Octave: two strings up, two frets up (three across the B string).','Tensions are compound intervals: 9 = 2nd, 11 = 4th, 13 = 6th, an octave higher.'],
  take:'Interval shapes turn the neck into a grid of known distances: every chord, arpeggio and melody is built from them.'},
 chordscale:{how:['Start from the chord’s quality, then ask what else the harmony suggests (alterations, the key, where it resolves).','Spell the scale from the chord’s root; check that the chord tones are in it.','Play the scale over a looped chord to hear the colour.'],
  rules:['maj7 → Ionian (or Lydian); m7 → Dorian; 7 → Mixolydian; m7♭5 → Locrian (or Locrian ♮2); dim7 → whole–half.','m(maj7) → melodic minor. 7♯11 → Lydian dominant (melodic minor built on the chord’s 5th: G7♯11 = D melodic minor). 7alt → altered scale (melodic minor a half step above the root).','7♭9 → half–whole diminished; 7♯5 → whole tone.','Avoid note: the 4th over maj7 and over 7 (it clashes with the 3rd); pass through it.','Dominant bebop: Mixolydian plus a major 7th between the root and ♭7, so chord tones land on the beat.'],
  take:'Chord–scale is a starting point, not a rule book: it tells you which notes are safe and which colours each chord can carry.'},
 shells:{how:['Learn the root-on-6 and root-on-5 shells for maj7, 7 and m7 first; that is a whole jazz standard already.','Play them through a II–V–I in every key around the cycle of fourths.','Then drop the root: the 3rd and 7th alone still sound like the chord.'],
  rules:['Shell with root on string 6: root, 7th (string 4), 3rd (string 3). Root on string 5: root, 7th (string 3), 3rd (string 2), skipping string 4. (Another common one, root–3rd–7th on strings 5-4-3, works too.)','6 chords: replace the 7th with the 6th.','Drop-3: lower the third voice from the top of a close voicing by an octave; a string is skipped above the bass.'],
  take:'Shells are the fastest comping voicings and they voice-lead by themselves. They are the backbone of big-band and bebop guitar.'},
 bends:{how:['Fret the target note first and listen to it; then bend the lower note up to exactly that pitch.','Bend with two or three fingers behind the bending finger, and turn the wrist as if turning a key: the fingertip alone runs out of strength and pitch.','Mute the strings you are not playing with the side of the picking hand and the fretting-hand thumb, so the bend rings alone.','Look at your pitch curve after each try: flat tops and clean releases are the goal.'],
  rules:['A half-step bend sounds like the next fret; a whole-step bend like two frets up. The target is a real pitch, not “up a bit”.','Bend and release: the release must land exactly on the fretted note.','Pre-bend: bend silently first, pick, then let it down.','Vibrato: even and controlled, about 5–6 cycles a second, roughly a quarter tone wide; on a bend, vibrato comes from relaxing and re-pushing the bend.','The quarter-tone curl (about half a fret sharp) is the blues “in-between” note, usually on the ♭3 or ♭7.'],
  take:'Bends and vibrato are the voice of rock and blues guitar: the difference between playing the right notes and sounding like Hendrix or Frusciante is mostly here. Pitch that is “nearly there” is heard as out of tune.'},
 sing:{how:['Sing the tonic after the cadence before you sing anything else.','Walk to the degree by step if you need to; then try to land it directly.','Use numbers or solfège out loud. Your voice is the most honest ear trainer.'],
  rules:['Hear the target in your head before you sing it (audiation).','Any octave counts; pitch accuracy matters more than tone.','Chord tones: hum the root, then the 3rd, 5th, 7th in order.'],
  take:'If you can sing it, you can play it: singing connects the ear to the instrument and is the fastest way to play by ear.'},
 cr:{how:['Sing the phrase back first, then play it.','Find the first note against the key, then follow the intervals.','Keep the phrase in one position so the shape is visible.'],
  rules:['Hear the key from the cadence; most phrases start on 1, 3 or 5.','Steps and skips: label each move (step up, 3rd down…).','Chromatic notes usually lead a half step into a chord tone.','Blues phrases: the minor pentatonic is 1 ♭3 4 5 ♭7 (♭5 for the blues scale); the rhythm and the rests are part of the phrase.','Double stops: two notes picked together, 3rds on neighbouring strings, 6ths with a string skipped.'],
  take:'Playing back what you hear is how jazz is learned: from records and from other players, in real time.'},
 arp:{how:['Find all the chord tones in the position first, then play them low to high.','Say the degree as you play it (R, 3, 5, 7).','Add the click only when you can play it slowly without stopping.'],
  rules:['maj7: R 3 5 7 · 7: R 3 5 ♭7 · m7: R ♭3 5 ♭7 · m7♭5: R ♭3 ♭5 ♭7 · dim7: R ♭3 ♭5 𝄫7.','Starting from the 3rd, 5th or 7th makes four more shapes from the same notes.','II–V: the 7th of IIm7 falls a half step to the 3rd of V.'],
  take:'Arpeggios are how lines outline the chords. Playing them in position, in time, is the first step to soloing on changes.'},
 analysis:{how:['Build the scale, stack every other note, and say the seven chords of the key in order.','Then write each chord of a progression as a numeral and mark its function.','Circle anything outside the key and ask where it resolves. Analyse the tunes you are learning, not just exercises.'],
  rules:['Major key, sevenths: <b>IMaj7 IIm7 IIIm7 IVMaj7 V7 VIm7 VIIm7♭5</b>; natural minor: Im7 IIm7♭5 ♭IIIMaj7 IVm7 Vm7 ♭VIMaj7 ♭VII7, harmonic minor gives V7.','Function: tonic I, IIIm7, VIm7; subdominant IIm7, IVMaj7; dominant V7, VIIm7♭5.','Which keys hold a chord: maj7 is I or IV (two keys), m7 is II, III or VI (three), 7 is V of exactly one key, m7♭5 is VII of one.','Secondary dominant: a dominant a 5th above its target (VI7 → IIm7 is V7/II). Tritone sub: a dominant a half step above its target (♭II7 → IMaj7).','Backdoor: IVm7 – ♭VII7 – IMaj7. Borrowed chords come from the parallel minor; ♯I°7 is a passing chord between I and IIm7.'],
  take:'Harmony as a map: once you see the key, the numerals and the familiar devices, every tune is a variation of moves you already know, and you can play it in any key.'},
 repertoire:{how:['Learn each tune in numerals, not just chord names: then it moves to any key.','Sing the roots along with the piano.','Learn the form (AABA, blues) before the details.'],
  rules:['Twelve-bar blues, one common jazz version: I7 IV7 I7 I7 · IV7 IV7 I7 VI7 · IIm7 V7 I7 V7.','Rhythm changes: AABA, 32 bars; A is I–VI–II–V turnarounds; the bridge is dominants around the cycle (III7 VI7 II7 V7).','Most standards are chains of II–V–Is between related keys.'],
  take:'Knowing the shared tunes is what lets you play with anyone at a jam session.'},
 walking:{how:['Beat 1: the root. Beat 4: an approach note into the next root.','Fill beats 2 and 3 with chord tones or scale steps.','Sing the line before you play it.'],
  rules:['Approach notes: a half step above or below the next root, a scale step, or the next chord’s 5th (dominant approach).','Strong beats get chord tones; the approach note is on the weak beat before the change.','On strings 6–3, keep the line in one position.'],
  take:'A walking line is the harmony played as a melody: the clearest way to hear and show where the changes go.'},
 voicelead:{how:['Find the 3rd and 7th of the first chord on the given strings.','Move each to the nearest 3rd or 7th of the next chord.','Play the two pairs back and forth until the motion is in your hands.'],
  rules:['II → V: the 7th of IIm7 falls a half step to the 3rd of V; the 3rd of IIm7 stays and becomes the 7th of V.','V → I: the 7th of V falls a half step to the 3rd of I; the 3rd of V stays as the 7th of IMaj7.','In minor: IIm7♭5 → V7 → Im7 follows the same motion.'],
  take:'Two voices moving by half steps outline a whole progression. It is the most efficient comping there is, and the skeleton of good lines.'},
 pulse:{how:['Count out loud and tap your foot on every beat; feel the subdivision before you play the first note.','When the click thins out to 2 and 4, to 4 only, or disappears, keep counting: the time is inside you.','Use Flow: let the tempo climb by itself while you stay clean, and stop the moment it gets sloppy.','Strum muted strings into the mic instead of tapping to put the time in your picking hand.'],
  rules:['Subdivide the beat you are playing: eighths as 1 & 2 &, triplets as 1 trip-let, sixteenths as 1 e & a.','Jazz time sits on 2 and 4; 1 and 3 are your answer to the click.','Swing eighths are long–short, about 2:1 at medium tempos, nearly even when fast.','Ahead, on and behind the beat are placements, not tempo changes: the pulse stays put.'],
  take:'Good time is a subdivision you never stop hearing, and a placement you choose.'},
 rhyread:{how:['Read the whole bar before the count-in; say the counts under the notes.','Add durations from the start of the bar to find where a note falls; a dot adds half, a tie adds the next note.','Tap the rhythm on the guitar body or strum muted strings; the hand must learn it, not only the eye.','Use Flow once a level is clean: endless bars, the tempo climbing by itself.'],
  rules:['Whole = 4, half = 2, quarter = 1, eighth = ½, sixteenth = ¼ beat in 4/4.','The dotted quarter + eighth is the first syncopation: 1 (hold) & of 2.','Eighth–quarter–eighth: the quarter sits off the beat and crosses it.','In 12/8 the click is the dotted quarter: three eighths per click.'],
  take:'Rhythm reading is a vocabulary of beat-long cells; once the cells are automatic, any chart is a sequence of things you already know.'},
 rhytheory:{how:['Say the counts out loud: 1 & 2 & 3 & 4 &, 1 trip-let, 1 e & a.','Add durations from the start of the bar; a dot adds half, a tie adds the next note.','Dictation: count the clicks, mark where the notes fall between them, then write the bar value by value (w h q e s; dot, rest, triplet, tie) and watch it take shape.','Check your answer by tapping it after: paper and hands must agree.'],
  rules:['Whole = 4, half = 2, quarter = 1, eighth = ½, sixteenth = ¼ beat in 4/4.','The top number of a time signature is beats per bar, the bottom is which note gets the beat.','Swing eighths are long–short; jazz time sits on 2 and 4; a push lands half a beat early.'],
  take:'Rhythm you can write is rhythm you can hear; the tapping games put it in the hands.'},
 jazzrhy:{how:['Swing everything here: the off-beat eighth sits on the last third of the beat.','Sing each figure with syllables (doo-dat, doo-ba-doo-dat) before you tap it.','Transcribe the rhythm of the first eight bars of a standard you play and add it under Your tunes; the level asks it back.','Play the etudes on one note on the guitar, then on a scale, then over the chord changes of a tune.'],
  rules:['Charleston: 1 and the and of 2. Displace it by an eighth or a beat and you have most comping rhythms.','A push places a chord on the and before the beat and holds it through the beat.','Three dotted quarters against four beats (q. q. q) and quarter-note triplets are the two ways to superimpose three on four.','Bebop phrases tend to start on the and of 1 and end on the and of 4.'],
  take:'The jazz language is a small set of rhythmic figures placed with intention; the notes come second.'},

  else if(a==='fixlist')openFix();
  else if(a==='fixdel')FIXDB.del(+b.dataset.id).then(openFix);
  else if(a==='savetake'&&LAST_TAKE&&S)wavSave(LAST_TAKE.x,LAST_TAKE.sr,`fretwise-${S.q.key}-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.wav`);
  else if(a==='micopt'){const g=G(view.gid);g.opts=g.opts||{};const k=b.dataset.k;if(b.type==='checkbox')g.opts[k]=b.checked;else g.opts[k]=isNaN(+b.value)?b.value:+b.value;saveGame(view.gid);render();}
  else if(a==='export'){view.export=!view.export;render();}
  else if(a==='importbox'){view.importbox=!view.importbox;render();}
  else if(a==='copyexport'){const ta=document.getElementById('exportta');const done=()=>{document.getElementById('copymsg').textContent='Copied.';};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.select();done();});else{ta.select();done();}}
  else if(a==='doimport'){try{const inc=JSON.parse(document.getElementById('importta').value);if(!inc||!inc.games)throw 0;let k=0;Object.entries(inc.games).forEach(([id,g])=>{if(!GBY[id])return;const cur=STORE.games[id];if(!cur||(g.n||0)>=(cur.n||0)){STORE.games[id]=g;k++;saveGame(id);}});saveLocal();view.importmsg=`Imported ${k} game${k===1?'':'s'}.`;view.importbox=true;render();}catch(e){view.importmsg='That text is not a Fretwise export.';render();}}
  else if(a==='round'){G(view.gid).round=+b.dataset.k;saveGame(view.gid);render();}
  else if(a==='mode'){const g=G(view.gid);g.mode=b.dataset.k;saveGame(view.gid);if(g.mode==='play')Piano.load();render();}
  else if(a==='sound'){const g=G(view.gid);g.sound=!g.sound;saveGame(view.gid);render();}
  else if(a==='mix'){const g=G(view.gid);g[b.dataset.k]=!g[b.dataset.k];saveGame(view.gid);render();}
  else if(a==='overview'){view={name:'overview'};render();window.scrollTo(0,0);}
  else if(a==='reference'){view={name:'reference'};render();window.scrollTo(0,0);}
  else if(a==='cat'){view={name:'home',list:true,cat:b.dataset.c};render();}
  else if(a==='master'){const c=b.dataset.c;TALK[c]=aiCached(c)||masterTalk(c);view={name:'master',cat:c,say:true};render();window.scrollTo(0,0);}
  else if(a==='mtalkagain'){const c=view.cat;TALK[c]=aiCached(c)||masterTalk(c);masterOpen(c);}
  else if(a==='hublist'){view={name:'home',list:true};render();window.scrollTo(0,0);}
  else if(a==='aiset'){view.aiset=!view.aiset;render();}
  else if(a==='aigo'){view={name:'home',aiset:true};render();window.scrollTo(0,0);}
  else if(a==='chatsend'){chatSend(view.gid);}
  else if(a==='chatclear'){CHAT[view.gid]=null;render();}
  else if(a==='aisave'){const v=(document.getElementById('aikey').value||'').trim();if(v&&!v.startsWith('•')){try{localStorage.setItem(AI.key,v);localStorage.removeItem(AI.cache);}catch(e){}AI.err='';TALK={};}render();}
  else if(a==='aiclear'){try{localStorage.removeItem(AI.key);localStorage.removeItem(AI.cache);}catch(e){}AI.err='';TALK={};render();}
  else if(a==='submit')answer(selArr());
  else if(a==='clear'){S.sel.clear();render();}
  else if(a==='quit')quit();
  else if(a==='reset'){view.confirm=true;render();}
  else if(a==='reset-no'){view.confirm=false;render();}
  else if(a==='reset-yes'){STORE.games[view.gid]=blank();view.confirm=false;saveGame(view.gid);render();}
});
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-act="tap"]');if(b){e.preventDefault();tapHit();}const g=e.target.closest&&e.target.closest('[data-act="gtap"]');if(g){e.preventDefault();grooveHit();}});
document.addEventListener('pointerup',e=>{if(GR&&GR.heldOn)grooveRelease();});document.addEventListener('pointercancel',e=>{if(GR&&GR.heldOn)grooveRelease();});
document.addEventListener('keyup',e=>{if(e.key===' '&&view.name==='groove'&&GR&&GR.started)grooveRelease();});
/* metronome controls: sliders apply while they move (no re-render, so the drag is not lost); the page redraws when they are let go */
document.addEventListener('input',e=>{const b=e.target,a=b.dataset&&b.dataset.act;if(!a||view.name!=='metro')return;const c=metCfg();
  if(a==='metslide'){c.bpm=+b.value;const n=document.getElementById('metbpm');if(n)n.textContent=c.bpm;}else if(a==='metswing')c.swing=+b.value;else if(a==='metvol')c[b.dataset.k]=+b.value/100;else return;metSave();if(!(MET&&MET.on))metDraw();});
document.addEventListener('change',e=>{const b=e.target,a=b.dataset&&b.dataset.act;if(!a||view.name!=='metro')return;const c=metCfg();
  if(a==='metchk')c[b.dataset.k]=b.checked;else if(a==='metsel')c[b.dataset.k]=b.value;else if(a==='metnum')c[b.dataset.k]=Math.max(+b.min,Math.min(+b.max,Math.round(+b.value)||+b.min));else if(!['metslide','metswing','metvol'].includes(a))return;metSave();render();});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset&&b.dataset.act==='micopt'&&b.tagName==='SELECT'){const g=G(view.gid);g.opts=g.opts||{};g.opts[b.dataset.k]=isNaN(+b.value)?b.value:+b.value;saveGame(view.gid);render();}});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('fixin'))clearTimeout(autoT);});   // writing a report pauses the auto-advance
/* a correct answer has no Next button: once the box is left empty (or the report is sent) it moves on by itself again */
const fixResume=()=>{if(view.name==='play'&&S&&S.locked){const l=S.answers.at(-1);if(l&&l.ok&&!l.hinted){clearTimeout(autoT);autoT=setTimeout(()=>{const el=document.activeElement;if(!(el&&el.classList&&el.classList.contains('fixin')&&el.value.trim()))nextQ();},1400);}}};
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('fixin')&&!e.target.value.trim())fixResume();});
document.addEventListener('input',e=>{if(e.target.id==='chatin'&&view.name==='lobby')chatOf(view.gid).draft=e.target.value;});
document.addEventListener('keydown',e=>{if(e.target.id==='chatin'){if(e.key==='Enter'){e.preventDefault();chatSend(view.gid);}return;}if(e.target.id==='aikey')return;if(e.target.classList&&e.target.classList.contains('fixin')){if(e.key==='Enter'){e.preventDefault();fixSend(e.target.id);}return;}
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(view.name==='metro'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!(e.target.tagName==='INPUT'&&e.target.type==='number')){if(e.key===' '){e.preventDefault();if(e.repeat)return;if(MET&&MET.on)metStop();else metStart();render();}else if(e.key==='t'||e.key==='T')metTap();else if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();const c=metCfg();c.bpm=Math.max(30,Math.min(300,c.bpm+(e.key==='ArrowUp'?1:-1)));metSave();render();}return;}
  if(view.name==='groove'&&GR&&!e.metaKey&&!e.ctrlKey&&!e.altKey){if(e.key===' '){e.preventDefault();if(e.repeat)return;GR.started?grooveHit():grooveGo();}else if(e.key==='Escape')grooveEnd();return;}
  if(view.name!=='play'||!S||e.metaKey||e.ctrlKey||e.altKey)return;const q=S.q,k=e.key;
  if(S.locked){if(k==='Enter'||k===' '){e.preventDefault();nextQ();}return;}
  if(q.ui==='multi'){if(k==='Enter'){e.preventDefault();answer(selArr());}else if(k==='Backspace'){S.sel.clear();render();}else if(k==='h'||k==='H'){if(!S.hinted)document.querySelector('[data-act="hint"]')?.click();}return;}
  if(q.ui==='rhywrite'){if(RW_VAL[k]){e.preventDefault();rwAdd(k);return;}if(k==='.'){S.rw.dot=!S.rw.dot;render();return;}if(k==='r'){S.rw.rest=!S.rw.rest;render();return;}if(k==='t'){S.rw.trip=S.rw.trip?0:Date.now()%100000+1;S.rw.tsum=0;render();return;}if(k==='_'||k==='-'){S.rw.tie=!S.rw.tie;render();return;}if(k==='Backspace'){e.preventDefault();rwUndo();return;}if(k==='Enter'){e.preventDefault();if(rwFull())answer(S.rw.ev.map(e=>({...e})));return;}return;}
  if(k==='h'||k==='H'){if(!S.hinted)document.querySelector('[data-act="hint"]')?.click();return;}
  if(k==='p'||k==='P'){if(q.audio)replayAudio();return;}
  if(q.ui==='mic'&&k===' '){e.preventDefault();if(S.listening)stopListening();else micListen();return;}
  if(q.ui==='tap'&&k===' '){e.preventDefault();if(e.repeat)return;if(TAP)tapHit();else tapBegin();return;}
  if(q.ui==='choices'&&/^[1-9]$/.test(k)){const i=+k-1;if(i<q.choices.length)answer(q.choices[i]);return;}
  if(q.ui==='spell'){if(k==='['||k==='-'){S.acc=-1;render();return;}if(k===']'||k==='='||k==='#'){S.acc=1;render();return;}if(k==='0'){S.acc=0;render();return;}
    if(k==='Backspace'){e.preventDefault();if(S.spell.length>spGiven())S.spell.pop();render();return;}if(q.tokens)return;const L=k.toUpperCase();if('CDEFGAB'.includes(L)&&L.length===1)spellKey(L);return;}
  if(q.ui==='letters'||q.ui==='pc'){if(k==='['||k==='-'){S.acc=-1;render();return;}if(k===']'||k==='='||k==='#'){S.acc=1;render();return;}if(k==='0'){S.acc=0;render();return;}
    const L=k.toUpperCase();if('CDEFGAB'.includes(L)&&L.length===1){if(q.ui==='letters')answer(L+ACC[S.acc]);else answer(mod(NAT[LET.indexOf(L)]+S.acc,12));}}
});
/* a tab left open keeps running the old app: check now and then for a newer deploy and say so */
function checkUpdate(){if(location.protocol==='file:'||BUILD==='dev')return;fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const BUILD='([^']+)'/);
  if(m&&m[1]!==BUILD&&!document.getElementById('upd')){const d=document.createElement('div');d.id='upd';d.className='updbar';d.innerHTML='A newer version of Fretwise is available. <button class="btn small primary" onclick="location.reload()">Reload</button>';document.body.prepend(d);}}).catch(()=>{});}
setInterval(checkUpdate,4*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
ckLoad();render();initCloud();document.getElementById('sync').addEventListener('click',()=>{if(!DB)initCloud();});
</script>
