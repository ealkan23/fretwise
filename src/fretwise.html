<title>Fretwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Chivo:wght@400;600;700&family=Chivo+Mono:wght@500&family=Noto+Music&display=swap">
<style>
/* Layout: amp-panel app shell — condensed caps labels, brass meters, one working surface per view */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#E2E5E9; --line:#CDD2D8; --fg:#15181C; --muted:#5B636D;
  --brass:#B47B1A; --brass-ink:#8A5A0B; --brass-soft:#F3E3C2;
  --good:#1E8556; --good-soft:#DDF1E6; --bad:#C23E2B; --bad-soft:#F8E0DB; --live:#D23B3B;
  --wood:#3A2A22; --wood-line:#B9B2A8; --pearl:#E9E4DA; --string:#C9C3B6;
  --o3:#2F6DB5; --o4:#1E8556; --o5:#B47B1A; --o6:#B03A6A;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Chivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Chivo Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-music:"Noto Music","Segoe UI Symbol","Apple Symbols",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D20; --sunk:#23272B; --line:#30353B; --fg:#ECEEF0; --muted:#9AA2AB;
  --brass:#E1A73E; --brass-ink:#EDBB5F; --brass-soft:#3A2E17;
  --good:#3DBB7E; --good-soft:#173527; --bad:#EE6A55; --bad-soft:#3E1F1A;
  --wood:#2A1D17; --wood-line:#6E655B; --pearl:#CFC8BA; --string:#A9A193; --o3:#5E9BE6; --o4:#3DBB7E; --o5:#E1A73E; --o6:#E06A9A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --sunk:#23272B; --line:#30353B; --fg:#ECEEF0; --muted:#9AA2AB;
  --brass:#E1A73E; --brass-ink:#EDBB5F; --brass-soft:#3A2E17;
  --good:#3DBB7E; --good-soft:#173527; --bad:#EE6A55; --bad-soft:#3E1F1A;
  --wood:#2A1D17; --wood-line:#6E655B; --pearl:#CFC8BA; --string:#A9A193; --o3:#5E9BE6; --o4:#3DBB7E; --o5:#E1A73E; --o6:#E06A9A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;padding:0}
.brand span{color:var(--brass)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:var(--brass-ink);border-color:var(--brass-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* home */
.hero{padding-block:28px 20px;display:grid;gap:8px}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:800}
.hero p{margin:0;max-width:66ch;color:var(--muted)}
.overall{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:8px;align-items:end}
.overall div{display:grid}
.overall b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:26px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .row{display:flex;gap:8px;margin-top:auto}
.card .row .btn{flex:1}
.pips{display:flex;gap:4px;align-items:center}
.pips i{width:22px;height:8px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.pips i.on{background:var(--brass);border-color:var(--brass)}
.pips span{margin-left:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.kv{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.kv b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
/* lobby */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding-block:24px 16px}
.head h1{font-size:clamp(30px,5vw,44px);font-weight:800}
.head .sp{margin-left:auto;display:flex;gap:8px}
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.rung.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.rung.locked{opacity:.55}
.rung .lv{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;text-align:center}
.rung .lv small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.rung b{font-weight:700}
.rung .d{color:var(--muted);font-size:13px;min-width:0}
.meter{width:110px;display:grid;gap:4px;justify-items:end;font-size:11px;color:var(--muted)}
.meter .bar{width:100%;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--brass)}
.setup{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--fg);color:var(--bg)}
.note{font-size:13px;color:var(--muted);max-width:60ch;margin:6px 0 0}
/* play */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:16px 10px}
.hud .t{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase}
.hud .stat{font-size:12px;color:var(--muted);display:grid;line-height:1.2}
.hud .stat b{font-family:var(--f-mono);color:var(--fg);font-size:17px;font-weight:500}
.hud .sp{margin-left:auto;display:flex;gap:18px;align-items:center}
.clockbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.clockbar i{display:block;height:100%;width:100%;background:var(--brass);transform-origin:left}
.clockbar.low i{background:var(--bad)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:12px;display:grid;gap:18px}
.qtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.review{background:var(--brass-soft);color:var(--brass-ink)}
.chip.stretch{background:var(--fg);color:var(--bg)}
.prompt{font-size:clamp(19px,2.6vw,24px);line-height:1.35;max-width:60ch}
.prompt .notes{font-family:var(--f-mono);font-size:.95em;white-space:nowrap}
.visual{overflow-x:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px;font-size:16px;min-width:0}
.choice kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface)}
.choice:hover:not([disabled]){border-color:var(--fg)}
.choice.right,.key.right{background:var(--good-soft);border-color:var(--good)}
.choice.wrong,.key.wrong{background:var(--bad-soft);border-color:var(--bad)}
.choice[disabled],.key[disabled]{cursor:default}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.keys.pc{grid-template-columns:repeat(6,1fr)}
.key{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 4px;font-weight:700;font-size:17px;font-family:var(--f-body)}
.key:hover:not([disabled]){border-color:var(--fg)}
.key.sharp{font-size:13px}
.accrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.accrow .seg button{font-family:var(--f-music);font-size:17px;padding:4px 16px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .sp{margin-left:auto}
.hintbox{font-size:14px;background:var(--brass-soft);color:var(--fg);border-radius:8px;padding:10px 12px}
.fb-panel{border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.fb-panel.ok{background:var(--good-soft)}
.fb-panel.no{background:var(--bad-soft)}
.fb-panel .v{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.fb-panel.ok .v{color:var(--good)} .fb-panel.no .v{color:var(--bad)}
.fb-panel p{margin:0}
.fb-panel .row{display:flex;justify-content:flex-end}
/* fretboard svg */
svg.fb{width:100%;min-width:560px;max-width:680px;display:block}
.fb-wood{fill:var(--wood)}
.fb-fret{stroke:var(--wood-line);stroke-width:2}
.fb-nut{fill:var(--pearl)}
.fb-inlay{fill:var(--pearl);opacity:.75}
.fb-str{stroke:var(--string)}
.fb-lab{fill:var(--muted);font:600 11px var(--f-body)}
.fb-num{fill:var(--muted);font:500 10px var(--f-mono);text-anchor:middle}
.fb-hit{fill:transparent;cursor:pointer}
.fb-hit:hover{fill:var(--brass);fill-opacity:.25}
.fb-mark{fill:var(--brass);stroke:var(--surface);stroke-width:2}
.fb-ok{fill:var(--good);stroke:var(--surface);stroke-width:2}
.fb-no{fill:var(--bad);stroke:var(--surface);stroke-width:2}
svg.fb circle,svg.fb text{pointer-events:none}
.fb-win{fill:var(--brass);fill-opacity:.16;stroke:var(--brass);stroke-width:1.5;stroke-dasharray:5 3}
.fb-alt{fill:none;stroke:var(--pearl);stroke-width:2;stroke-dasharray:3 2}
.staffwrap{margin-bottom:6px}
.fb-miss{fill:var(--good);fill-opacity:.4;stroke:var(--pearl);stroke-width:2;stroke-dasharray:3 2}
.fb-dot-t{fill:#fff;font:700 10px var(--f-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
/* staff svg */
svg.staff{width:100%;max-width:360px;display:block}
.st-line{stroke:var(--fg);stroke-width:1.3}
.st-glyph{fill:var(--fg);font-family:var(--f-music)}
.st-head{fill:none;stroke:var(--fg);stroke-width:3}
.st-acc line{stroke:var(--fg);stroke-width:1.3}
.st-acc line.bar{stroke-width:2.6}
.st-acc .bowl{fill:none;stroke:var(--fg);stroke-width:2.2}
.st-head.ok{stroke:var(--good)}
/* chord boxes */
.boxes{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
svg.box{display:block;max-width:100%;height:auto}
.bx-fret{stroke:var(--line);stroke-width:1.2}
.bx-nut{stroke:var(--fg);stroke-width:4}
.bx-str{stroke:var(--muted);stroke-width:1}
.bx-num{fill:var(--muted);font:500 9px var(--f-mono);text-anchor:end}
.bx-x{fill:var(--muted);font:600 12px var(--f-body);text-anchor:middle}
.bx-open{fill:none;stroke:var(--fg);stroke-width:1.4}
.bx-dot{fill:var(--brass)}
.bx-lab{fill:var(--surface);font:700 8.5px var(--f-body);text-anchor:middle;dominant-baseline:central}
.bx-olab{fill:var(--brass-ink);font:700 8px var(--f-body);text-anchor:middle}
.bx-title{fill:var(--fg);font:700 12px var(--f-body);text-anchor:middle}
.bx-arrow{color:var(--muted);font-size:18px}
/* staff-fretboard map */
.refmap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;display:grid;gap:10px;min-width:0}
.refhead{display:grid;gap:6px}.refhead h3{font-size:20px;font-weight:800}
.refscroll{overflow-x:auto}
svg.refstaff{display:block;max-width:none}
.refn{cursor:pointer}.refn.dim{opacity:.28}.refn:focus-visible{outline:none}.refn:focus-visible ellipse{stroke:var(--fg);stroke-width:2}
.ref-lab{font:700 11px var(--f-body);text-anchor:middle}
.ref-open{fill:var(--muted);font:500 8px var(--f-mono);text-anchor:middle}
.ref-sel{fill:var(--brass);fill-opacity:.12;stroke:var(--brass);stroke-width:1.2}
.o3f{fill:var(--o3)}.o4f{fill:var(--o4)}.o5f{fill:var(--o5)}.o6f{fill:var(--o6)}
.o3t{fill:var(--o3)}.o4t{fill:var(--o4)}.o5t{fill:var(--o5)}.o6t{fill:var(--o6)}
.legend i.o3b{background:var(--o3)}.legend i.o4b{background:var(--o4)}.legend i.o5b{background:var(--o5)}.legend i.o6b{background:var(--o6)}
svg.fb circle.dim,svg.fb text.dim{opacity:.18}
#refneck .fb-dot-t{font-size:8.5px;fill:var(--surface)}
#refneck svg.fb circle[class^="o"]{stroke:var(--wood);stroke-width:1.5}
.nm-nat{fill:var(--brass);stroke:var(--wood);stroke-width:1.5}
.nm-acc{fill:var(--pearl);stroke:var(--wood);stroke-width:1.5}
#notemap .fb-dot-t{font-size:9px;fill:var(--surface)}
#notemap .fb-dot-t.nm-acct{fill:var(--wood);font-size:8px}
#notemap .seg{justify-self:start}
/* categories, listening cards */
.catnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.catnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.catnav button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.catsec{margin-top:26px;display:grid;gap:12px}
.cathead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.cathead h2{font-size:24px;font-weight:800}
.cathead p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.cathead .kv{margin-left:auto}
.card.mic{border-style:dashed}
.listen{display:flex;align-items:center;gap:14px;background:var(--sunk);border-radius:10px;padding:14px 16px;max-width:420px}
.listen .lc-ic{font-family:var(--f-music);font-size:30px;line-height:1;color:var(--brass)}
.reveal2{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.reveal2 svg.staff{max-width:260px}
.mixrow{display:grid;gap:6px;margin-top:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brass)}
.ch-bar{fill:var(--brass);fill-opacity:.35}
.ch-barok{fill:var(--good)}
.exportta{width:100%;min-height:90px;font:12px var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--fg);margin-top:8px}
.refblock{margin-top:12px}
svg.circle{width:100%;max-width:360px;display:block;margin:8px auto}
.cf-ring{fill:none;stroke:var(--line)}
.cf-maj{fill:var(--fg);font:700 15px var(--f-body);text-anchor:middle}
.cf-min{fill:var(--brass-ink);font:600 12px var(--f-body);text-anchor:middle}
.cf-sig{fill:var(--muted);font:500 10px var(--f-mono);text-anchor:middle}
.cf-c{fill:var(--muted);font:600 11px var(--f-body);text-anchor:middle}
.lobbynote{font-size:14px;color:var(--muted);max-width:70ch;margin:0 0 14px}
.playhint{margin-top:8px;font-size:14px;color:var(--brass-ink);font-weight:500}
.lesson{max-width:78ch;margin:0 0 14px;font-size:14px;color:var(--fg)}.lesson summary{cursor:pointer;font-weight:600;color:var(--brass-ink);padding:6px 0}.lesson p{margin:8px 0}
.diag{background:var(--brass-soft);border-radius:6px;padding:8px 10px;margin:0 0 6px}
.fixrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.fixin{flex:1;min-width:260px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.tnotes{display:grid;gap:10px}.tnote{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:var(--r);padding:12px 16px}.tnote b{font-size:15px}.tnote p{margin:4px 0 0;font-size:14px;line-height:1.5;max-width:80ch}.tnote.good{border-left-color:var(--good)}.tnote.bad{border-left-color:var(--bad)}.tile small{font-size:12px}
/* results & stats */
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile b{font-family:var(--f-mono);font-size:24px;font-weight:500}
.tile span{font-size:12px;color:var(--muted)}
.banner{background:var(--fg);color:var(--bg);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner h2{font-size:26px;font-weight:800;color:var(--brass)}
.section{margin-top:26px;display:grid;gap:12px}
.section h3{font-size:20px;font-weight:800}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.lvbars{display:grid;gap:8px}
.lvbar{display:grid;grid-template-columns:64px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.lvbar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden;position:relative}
.lvbar .track i{position:absolute;inset:0 auto 0 0;background:var(--brass)}
.lvbar .track u{position:absolute;top:-2px;bottom:-2px;left:85%;border-left:2px dashed var(--muted);text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
svg.chart{width:100%;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-lab{fill:var(--muted);font:500 10px var(--f-mono)}
.ch-line{fill:none;stroke:var(--brass);stroke-width:2.2}
.ch-area{fill:var(--brass);fill-opacity:.14}
.ch-dot{fill:var(--brass)}
.heat{display:grid;gap:3px;font-size:11px}
.heat .r{display:grid;grid-template-columns:28px repeat(13,minmax(0,1fr));gap:3px;align-items:center}
.heat .c{aspect-ratio:1.4;border-radius:3px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:#fff}
.heat .h{text-align:center;color:var(--muted);font-family:var(--f-mono)}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (max-width:560px){
  .setup{grid-template-columns:1fr}

.tapbtn{min-width:220px;transition:transform .05s}.tapbtn.hit{transform:scale(.96);filter:brightness(1.2)}.hl{background:var(--brass-soft);border-radius:4px;padding:0 3px}.cents{font-style:normal;color:var(--brass)}

<script>
/* ============ MUSIC CORE ============ */
const LET='CDEFGAB', NAT=[0,2,4,5,7,9,11];
const ACC={'-2':'𝄫','-1':'♭','0':'','1':'♯','2':'𝄪'};
const R=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const mod=(n,m)=>((n%m)+m)%m;
function P(s){const l=LET.indexOf(s[0]);let a=0;for(const ch of s.slice(1)){if(ch==='#'||ch==='♯')a++;else if(ch==='b'||ch==='♭')a--;}return {l,a};}
const pc=n=>mod(NAT[n.l]+n.a,12);
const nm=n=>LET[n.l]+ACC[n.a];
const same=(a,b)=>a.l===b.l&&a.a===b.a;
function tr(root,num,semi){const l=mod(root.l+num-1,7);let d=mod(pc(root)+semi-NAT[l],12);if(d>6)d-=12;return {l,a:d};}
function trDown(root,num,semi){const l=mod(root.l-(num-1),7);let d=mod(pc(root)-semi-NAT[l],12);if(d>6)d-=12;return {l,a:d};}
const IV={P1:[1,0],m2:[2,1],M2:[2,2],A2:[2,3],m3:[3,3],M3:[3,4],d4:[4,4],P4:[4,5],A4:[4,6],d5:[5,6],P5:[5,7],A5:[5,8],m6:[6,8],M6:[6,9],d7:[7,9],m7:[7,10],M7:[7,11],P8:[8,12],b9:[9,13],'9':[9,14],'#9':[9,15],'11':[11,17],'#11':[11,18],b13:[13,20],'13':[13,21]};
const ORD=['','1st','2nd','3rd','4th','5th','6th','7th','octave'];
const QW={P:'perfect',M:'major',m:'minor',A:'augmented',d:'diminished'};
function ivLong(k){if(k==='P8')return 'perfect octave';if(k==='P1')return 'unison';return QW[k[0]]+' '+ORD[+k.slice(1)];}
const SC={major:[0,2,4,5,7,9,11],natural:[0,2,3,5,7,8,10],harmonic:[0,2,3,5,7,8,11],melodic:[0,2,3,5,7,9,11]};
const scale=(root,type)=>SC[type].map((s,i)=>tr(root,i+1,s));
const SHARP_KEYS=['C','G','D','A','E','B','F#','C#'], FLAT_KEYS=['F','Bb','Eb','Ab','Db','Gb','Cb'];
const ALL_MAJ=[...SHARP_KEYS,...FLAT_KEYS];
function sigOf(key){const i=SHARP_KEYS.indexOf(key);if(i>=0)return {n:i,t:'♯'};return {n:FLAT_KEYS.indexOf(key)+1,t:'♭'};}
const sigTxt=s=>s.n===0?'no sharps or flats':s.n+s.t;
const relMinor=k=>tr(P(k),6,9);
const ORDER_SH='FCGDAEB', ORDER_FL='BEADGCF';
const kname=k=>nm(P(k));
// chords
const CH={'':['P1','M3','P5'],m:['P1','m3','P5'],dim:['P1','m3','d5'],aug:['P1','M3','A5'],
 maj7:['P1','M3','P5','M7'],'7':['P1','M3','P5','m7'],m7:['P1','m3','P5','m7'],'m7♭5':['P1','m3','d5','m7'],dim7:['P1','m3','d5','d7'],
 'm(maj7)':['P1','m3','P5','M7'],'6':['P1','M3','P5','M6'],m6:['P1','m3','P5','M6'],sus2:['P1','M2','P5'],sus4:['P1','P4','P5'],add9:['P1','M3','P5','9'],
 '9':['P1','M3','P5','m7','9'],maj9:['P1','M3','P5','M7','9'],m9:['P1','m3','P5','m7','9'],'11':['P1','M3','P5','m7','9','11'],m11:['P1','m3','P5','m7','9','11'],
 '13':['P1','M3','P5','m7','9','11','13'],'7♭9':['P1','M3','P5','m7','b9'],'7♯9':['P1','M3','P5','m7','#9']};
const DEG={P1:'1',m2:'♭2',M2:'2',m3:'♭3',M3:'3',P4:'4',A4:'♯4',d5:'♭5',P5:'5',A5:'♯5',m6:'♭6',M6:'6',d7:'𝄫7',m7:'♭7',M7:'7','9':'9',b9:'♭9','#9':'♯9','11':'11','#11':'♯11','13':'13',b13:'♭13'};
const QNAME={'':'major triad',m:'minor triad',dim:'diminished triad',aug:'augmented triad',maj7:'major 7th','7':'dominant 7th',m7:'minor 7th','m7♭5':'half-diminished 7th',dim7:'fully diminished 7th','m(maj7)':'minor-major 7th','6':'major 6th',m6:'minor 6th',sus2:'sus2',sus4:'sus4',add9:'add9','9':'dominant 9th',maj9:'major 9th',m9:'minor 9th','11':'dominant 11th',m11:'minor 11th','13':'dominant 13th','7♭9':'7♭9','7♯9':'7♯9'};
const chord=(root,q)=>CH[q].map(k=>tr(root,...IV[k]));
const sym=(root,q)=>nm(root)+q;
const spell=ns=>ns.map(nm).join(' – ');
const formula=q=>CH[q].map(k=>DEG[k]).join(' ');
const okAcc=(ns,max=1)=>ns.every(n=>Math.abs(n.a)<=max);
function triadQ(ns){const a=mod(pc(ns[1])-pc(ns[0]),12),b=mod(pc(ns[2])-pc(ns[0]),12);return a===4&&b===7?'':a===3&&b===7?'m':a===3&&b===6?'dim':a===4&&b===8?'aug':'?';}
function seventhQ(ns){const t=triadQ(ns),s=mod(pc(ns[3])-pc(ns[0]),12);return ({'|11':'maj7','|10':'7','m|10':'m7','m|11':'m(maj7)','dim|10':'m7♭5','dim|9':'dim7','aug|11':'maj7♯5'})[t+'|'+s]||'?';}
function diatonic(sc,i,seventh){const ns=[sc[i],sc[(i+2)%7],sc[(i+4)%7]];if(seventh)ns.push(sc[(i+6)%7]);return {root:sc[i],q:seventh?seventhQ(ns):triadQ(ns),notes:ns};}
const ROM_MAJ=['I','ii','iii','IV','V','vi','vii°'], ROM_MAJ7=['Imaj7','ii7','iii7','IVmaj7','V7','vi7','viiø7'];
const ROM_MIN=['i','ii°','III','iv','v','VI','VII'], ROM_MIN7=['i7','iiø7','IIImaj7','iv7','v7','VImaj7','VII7'];
const ROOTS_EASY=['C','D','E','F','G','A','B','Bb','Eb','F#','Ab'];
const ROOTS_ALL=['C','C#','Db','D','Eb','E','F','F#','Gb','G','Ab','A','Bb','B'];
function respell(n){for(const dl of shuffle([1,-1])){const l=mod(n.l+dl,7);let a=mod(pc(n)-NAT[l],12);if(a>6)a-=12;if(Math.abs(a)<=2)return {l,a};}return null;}
function noteDists(n){const out=[];const e=respell(n);if(e)out.push(nm(e));for(const d of shuffle([1,-1]))if(Math.abs(n.a+d)<=2)out.push(nm({l:n.l,a:n.a+d}));out.push(nm({l:mod(n.l+1,7),a:n.a}),nm({l:mod(n.l-1,7),a:n.a}));return out;}
function spellDists(ns,root,qs){const out=[];const idx=shuffle(ns.map((_,i)=>i).slice(1));
  const i1=idx[0],e=respell(ns[i1]);if(e){const c=ns.slice();c[i1]=e;out.push(spell(c));}
  const i2=idx[idx.length>1?1:0];for(const d of shuffle([1,-1]))if(Math.abs(ns[i2].a+d)<=2){const c=ns.slice();c[i2]={l:ns[i2].l,a:ns[i2].a+d};out.push(spell(c));break;}
  for(const q of shuffle(qs||[]))out.push(spell(chord(root,q)));return out;}
function mc(ans,d,n=4){const s=[ans];for(const x of d){if(x&&!s.includes(x))s.push(x);if(s.length>=n)break;}return shuffle(s);}
function pickChord(roots,qs,max=1){for(let t=0;t<40;t++){const root=P(rootPick(roots)),q=R(qs),ns=chord(root,q);if(okAcc(ns,max))return {root,q,ns};}const root=P('C'),q=qs[0];return {root,q,ns:chord(root,q)};}
const notesHTML=ns=>`<span class="notes">${ns.map(nm).join(' ')}</span>`;
const C=(o)=>Object.assign({ui:'choices',factor:1.6},o);

/* ============ FRETBOARD ============ */
const OPEN=[null,64,59,55,50,45,40], OPN=[null,'e','B','G','D','A','E'];
const PCN=['C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭','A','A♯/B♭','B'];
function fretSVG(o={}){const W=46,X0=48,Y0=16,SY=24,FW=X0+12*W+6,H=Y0+5*SY+30;
  const x=f=>f===0?30:X0+(f-.5)*W, y=s=>Y0+(s-1)*SY;
  let h=`<svg class="fb" viewBox="0 0 ${FW} ${H}" role="img" aria-label="Guitar fretboard, string 1 on top">`;
  h+=`<rect class="fb-wood" x="${X0}" y="${Y0-9}" width="${12*W}" height="${5*SY+18}" rx="2"/>`;
  if(o.win){const [lo,hi]=o.win,x1=lo===0?18:X0+(lo-1)*W,x2=X0+hi*W;h+=`<rect class="fb-win" x="${x1}" y="${Y0-12}" width="${x2-x1}" height="${5*SY+24}" rx="4"/>`;}
  [3,5,7,9].forEach(f=>h+=`<circle class="fb-inlay" cx="${x(f)}" cy="${Y0+2.5*SY}" r="5"/>`);
  h+=`<circle class="fb-inlay" cx="${x(12)}" cy="${Y0+1.5*SY}" r="5"/><circle class="fb-inlay" cx="${x(12)}" cy="${Y0+3.5*SY}" r="5"/>`;
  for(let f=1;f<=12;f++)h+=`<line class="fb-fret" x1="${X0+f*W}" x2="${X0+f*W}" y1="${Y0-9}" y2="${Y0+5*SY+9}"/>`;
  h+=`<rect class="fb-nut" x="${X0-5}" y="${Y0-9}" width="6" height="${5*SY+18}"/>`;
  for(let s=1;s<=6;s++){h+=`<line class="fb-str" x1="18" x2="${FW-4}" y1="${y(s)}" y2="${y(s)}" stroke-width="${(0.9+(s-1)*0.38).toFixed(2)}"/>`;h+=`<text class="fb-lab" x="2" y="${y(s)+4}">${s}${OPN[s]}</text>`;}
  for(let f=0;f<=12;f++)h+=`<text class="fb-num" x="${x(f)}" y="${H-4}">${f}</text>`;
  if(o.click)for(let s=1;s<=6;s++)for(let f=0;f<=12;f++)h+=`<rect class="fb-hit" data-s="${s}" data-f="${f}" x="${f===0?18:X0+(f-1)*W}" y="${y(s)-SY/2}" width="${f===0?X0-20:W}" height="${SY}" rx="4"/>`;
  (o.dots||[]).forEach(d=>h+=`<circle class="${d.cls}" cx="${x(d.f)}" cy="${y(d.s)}" r="9.5"/>`+(d.t?`<text class="fb-dot-t${/\bdim\b/.test(d.cls)?' dim':''}${d.tc?' '+d.tc:''}" x="${x(d.f)}" y="${y(d.s)}">${d.t}</text>`:''));
  return h+'</svg>';}
function landmark(s,f){const marks=[0,5,7,12];let best=0;for(const m of marks)if(Math.abs(m-f)<Math.abs(best-f))best=m;const p=(OPEN[s]+best)%12;return `Fret ${best} on string ${s} is ${PCN[p]}. Count ${Math.abs(f-best)} fret${Math.abs(f-best)===1?'':'s'} ${f>=best?'up':'down'} from there.`;}
function fbId(strs,f0,f1){return ()=>{const s=R(strs),f=ri(f0,f1),p=(OPEN[s]+f)%12;
  return {snd:{note:OPEN[s]+f},key:`id-${s}-${f}`,label:`String ${s}, fret ${f}`,ui:'pc',answer:p,answerText:PCN[p],factor:1,
   prompt:`Name the note at <b>string ${s}</b>, fret <b>${f}</b>.`,visual:fretSVG({dots:[{s,f,cls:'fb-mark'}]}),
   explain:`Open string ${s} is ${OPN[s].toUpperCase()}. ${f} fret${f===1?'':'s'} up gives ${PCN[p]}. Half steps fall between B–C and E–F; every other natural pair is a whole step.`,
   hint:landmark(s,f),reveal:{dots:[{s,f,cls:'fb-ok',t:PCN[p].split('/')[0]}]}};};}
function fbLoc(nat){return ()=>{const s=ri(1,6);let p;do p=ri(0,11);while(nat&&PCN[p].length>1);
  const fs=[];for(let f=0;f<=12;f++)if((OPEN[s]+f)%12===p)fs.push(f);
  return {snd:{note:OPEN[s]+fs[0]},key:`loc-${s}-${p}`,label:`Find ${PCN[p]} on string ${s}`,ui:'fret',factor:1.3,answerText:`fret ${fs.join(' or ')}`,
   prompt:`Click <b>${PCN[p]}</b> on <b>string ${s}</b> (frets 0–12).`,valid:(a,b)=>a===s&&(OPEN[s]+b)%12===p,
   explain:`${PCN[p]} on string ${s} sits at fret ${fs.join(' and ')}. Frets 0 and 12 are the same note an octave apart.`,
   hint:`String ${s} is tuned to ${OPN[s].toUpperCase()}. Fret 5 is ${PCN[(OPEN[s]+5)%12]}, fret 7 is ${PCN[(OPEN[s]+7)%12]}.`,
   reveal:{dots:fs.map(f=>({s,f,cls:'fb-ok'}))}};};}
function fbOct(){return ()=>{for(let t=0;t<50;t++){const s=ri(2,6),f=ri(0,10),m=OPEN[s]+f,ans=[];
  for(let s2=1;s2<=6;s2++)if(s2!==s)for(let f2=0;f2<=12;f2++)if(Math.abs(OPEN[s2]+f2-m)===12)ans.push({s:s2,f:f2});
  if(!ans.length)continue;const p=m%12;
  return {snd:{seq:[m,OPEN[ans[0].s]+ans[0].f]},key:`oct-${s}-${f}`,label:`Octave of S${s} F${f}`,ui:'fret',factor:1.4,answerText:ans.map(a=>`S${a.s} F${a.f}`).join(', '),
   prompt:`The marked note is <b>${PCN[p]}</b>. Click the same note one octave higher or lower on a different string.`,mark:{s,f},
   valid:(a,b)=>a!==s&&Math.abs(OPEN[a]+b-m)===12,
   explain:`Octave shapes: from strings 6, 5 or 4, go two strings over and two frets up. Crossing the B string adds one fret (three frets up). Two strings back and two frets down gives the lower octave.`,
   hint:`Try two strings toward the floor and two frets up${s<=4?' (three frets if you cross onto string 2 or 1)':''}.`,
   reveal:{dots:[{s,f,cls:'fb-mark'},...ans.map(a=>({s:a.s,f:a.f,cls:'fb-ok'}))]}};}};}

/* ============ TREBLE CLEF ============ */
// step 0 = E4 (bottom line). letter idx = (2+step) mod 7
const stepNote=s=>({l:mod(2+s,7),a:0}), stepOct=s=>4+Math.floor((2+s)/7);
const SH_POS=[8,5,9,6,3,7,4], FL_POS=[4,7,3,6,2,5,1];
// accidentals drawn as paths (not font glyphs) so they sit exactly on the line/space on every device
function accSVG(g,x,cy){if(g==='♯')return `<g class="st-acc"><line x1="${x-2.6}" x2="${x-2.6}" y1="${cy-10}" y2="${cy+11}"/><line x1="${x+2.6}" x2="${x+2.6}" y1="${cy-11}" y2="${cy+10}"/><line class="bar" x1="${x-5.5}" x2="${x+5.5}" y1="${cy-1.8}" y2="${cy-4.8}"/><line class="bar" x1="${x-5.5}" x2="${x+5.5}" y1="${cy+4.8}" y2="${cy+1.8}"/></g>`;
  if(g==='♭')return `<g class="st-acc"><line x1="${x-3}" x2="${x-3}" y1="${cy-15}" y2="${cy+5}"/><path class="bowl" d="M${x-3},${cy+5} C${x+7},${cy-1} ${x+6},${cy-7.5} ${x-3},${cy-2}"/></g>`;return '';}
function staffSVG(o){const S=7,BL=104,y=s=>BL-s*S,W=320,top=Math.min(0,y(o.step)-22),bot=Math.max(150,y(o.step)+22);let h=`<svg class="staff" viewBox="0 ${top} ${W} ${bot-top}" role="img" aria-label="Treble clef staff">`;
  for(let i=0;i<5;i++)h+=`<line class="st-line" x1="6" x2="${W-6}" y1="${y(i*2)}" y2="${y(i*2)}"/>`;
  h+=`<text class="st-glyph" x="10" y="${y(2)}" font-size="56">𝄞</text>`;
  let kx=64;if(o.sig){const pos=o.sig.t==='♯'?SH_POS:FL_POS;for(let i=0;i<o.sig.n;i++){h+=accSVG(o.sig.t,kx+5,y(pos[i]));kx+=12;}}

/* ============ RHYTHM: notation, tap engine, click games ============ */
/* events: [{t,d,rest,tup}] in beats; renders one or two bars of 4/4 on a single line */
function rhySVG(ev,bars=1,o={}){const BW=76,X0=44,Y=46,W=X0+bars*4*BW+12,H=96;let h=`<svg class="rhy" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rhythm notation">`;
  h+=`<line class="rh-line" x1="8" x2="${W-6}" y1="${Y}" y2="${Y}"/>`;for(let b=0;b<=bars;b++){const x=X0-14+b*4*BW;h+=`<line class="rh-bar" x1="${x}" x2="${x}" y1="${Y-22}" y2="${Y+22}"/>`;}
  h+=`<text class="rh-ts" x="14" y="${Y-3}">4</text><text class="rh-ts" x="14" y="${Y+17}">4</text>`;if(o.swing)h+=`<text class="rh-sw" x="${X0}" y="12">swing eighths</text>`;

  const pieces=[];ev.forEach(e=>{if(e.rest){pieces.push({...e});return;}let t=e.t,d=e.d,first=true;while(d>1e-6){const inBeat=Math.floor(t+1e-6),room=inBeat+1-t;let take;
      if(Math.abs(t-Math.round(t))<1e-6&&(d===2||d===4||(d===3&&t%4<=1)))take=d;else if(d===1.5&&Math.abs(t-Math.round(t))<1e-6)take=1.5;else take=Math.min(d,room);
      pieces.push({t,d:take,tup:e.tup,tieTo:d-take>1e-6,tieFrom:!first});t+=take;d-=take;first=false;}});
  const stems=[];
  pieces.forEach(p=>{const x=X(p.t);if(p.rest){if(p.d>=1){if(p.d>=2)h+=`<rect class="rh-rest" x="${x-7}" y="${Y-7}" width="14" height="6"/>`;else h+=`<path class="rh-qrest" d="M${x-4} ${Y-14} l7 8 l-6 7 l6 8 c-6 -3 -9 1 -5 6 c-7 -3 -8 -9 -3 -12 l-6 -7 z"/>`;}
      else if(p.d>=0.5)h+=`<circle class="rh-rest" cx="${x-3}" cy="${Y-6}" r="2.6"/><path class="rh-rstem" d="M${x+3} ${Y-6} l-6 15"/>`;else h+=`<circle class="rh-rest" cx="${x-3}" cy="${Y-6}" r="2.2"/><circle class="rh-rest" cx="${x-5}" cy="${Y}" r="2.2"/><path class="rh-rstem" d="M${x+3} ${Y-6} l-7 18"/>`;return;}
    const hollow=p.d>=2;h+=`<ellipse class="rh-head${hollow?' hollow':''}" cx="${x}" cy="${Y}" rx="6.2" ry="4.4" transform="rotate(-22 ${x} ${Y})"/>`;
    if(p.d===1.5||p.d===3||p.d===0.75)h+=`<circle class="rh-dot" cx="${x+10}" cy="${Y-4}" r="1.8"/>`;
    if(p.d<4)h+=`<line class="rh-stem" x1="${x+5.5}" x2="${x+5.5}" y1="${Y-1}" y2="${Y-30}"/>`;
    heads.push({x,t:p.t,tieTo:p.tieTo});if(p.d<1&&!p.tup)stems.push({x:x+5.5,t:p.t,d:p.d,beat:Math.floor(p.t+1e-6)});if(p.tup)stems.push({x:x+5.5,t:p.t,d:p.d,beat:Math.floor(p.t+1e-6),tup:p.tup});});

  Object.values(groups).forEach(g=>{g.sort((a,b)=>a.t-b.t);if(g.length===1){const s=g[0];if(s.d<1)h+=`<path class="rh-flag" d="M${s.x} ${Y-30} c 6 4 9 10 5 18 c 2 -7 -1 -11 -5 -13 z"/>`;if(s.d<=0.25)h+=`<path class="rh-flag" d="M${s.x} ${Y-23} c 6 4 9 10 5 18 c 2 -7 -1 -11 -5 -13 z"/>`;return;}
    const x1=g[0].x,x2=g.at(-1).x;h+=`<line class="rh-beam" x1="${x1}" x2="${x2}" y1="${Y-30}" y2="${Y-30}"/>`;
    g.forEach((s,i)=>{if(s.d<=0.25){const nx=g[i+1],px=g[i-1];const a=nx&&nx.d<=0.25?nx.x:px&&px.d<=0.25?s.x:s.x+(nx?8:-8),b=s.x;h+=`<line class="rh-beam" x1="${Math.min(a,b)}" x2="${Math.max(a,b)}" y1="${Y-25}" y2="${Y-25}"/>`;}});
    if(g[0].tup)h+=`<text class="rh-tup" x="${(x1+x2)/2}" y="${Y-35}">3</text>`;});
  heads.forEach((hd,i)=>{if(hd.tieTo&&heads[i+1]){const a=hd.x+4,b=heads[i+1].x-4;h+=`<path class="rh-tie" d="M${a} ${Y+7} Q ${(a+b)/2} ${Y+16} ${b} ${Y+7}"/>`;}});
  for(let b=0;b<bars*4;b++)h+=`<text class="rh-cnt" x="${X(b)}" y="${Y+36}">${b%4+1}</text>`;
  return h+'</svg>';}
/* rhythm cells per beat: onsets and notation events */
const RCELL={
 q:{b:1,ev:[{t:0,d:1}]},ee:{b:1,ev:[{t:0,d:.5},{t:.5,d:.5}]},r:{b:1,ev:[{t:0,d:1,rest:1}]},re:{b:1,ev:[{t:0,d:.5,rest:1},{t:.5,d:.5}]},er:{b:1,ev:[{t:0,d:.5},{t:.5,d:.5,rest:1}]},
 h:{b:2,ev:[{t:0,d:2}]},qe:{b:2,ev:[{t:0,d:1.5},{t:1.5,d:.5}]},eq:{b:2,ev:[{t:0,d:.5},{t:.5,d:1.5}]},eqe:{b:2,ev:[{t:0,d:.5},{t:.5,d:1},{t:1.5,d:.5}]},tie:{b:2,ev:[{t:0,d:.5},{t:.5,d:1.5}]},
 trip:{b:1,ev:[{t:0,d:1/3,tup:1},{t:1/3,d:1/3,tup:1},{t:2/3,d:1/3,tup:1}]},ess:{b:1,ev:[{t:0,d:.5},{t:.5,d:.25},{t:.75,d:.25}]},sse:{b:1,ev:[{t:0,d:.25},{t:.25,d:.25},{t:.5,d:.5}]},ssss:{b:1,ev:[{t:0,d:.25},{t:.25,d:.25},{t:.5,d:.25},{t:.75,d:.25}]},
 ant:{b:2,ev:[{t:0,d:1},{t:1,d:.5},{t:1.5,d:.5}]} /* quarter, then an eighth pushed into the next beat written as a tie: handled by eqe/tie */};
function rhyBar(cells,bars=1,swing){const ev=[];let t=0,tup=0;const total=bars*4;let guard=0;
  while(t<total&&guard++<200){const pool=cells.filter(c=>t+RCELL[c].b<=total&&!(RCELL[c].b===2&&t%4===3));if(!pool.length)break;const c=R(pool);RCELL[c].ev.forEach(e=>{const x={...e,t:t+e.t};if(e.tup)x.tup=++tup;ev.push(x);});t+=RCELL[c].b;}

  if(!ev.some(e=>!e.rest))ev[0]={t:0,d:1};
  const on=ev.filter(e=>!e.rest).map(e=>swing&&Math.abs(e.t%1-0.5)<1e-6?Math.floor(e.t)+0.67:e.t);return {ev,on};}
const tapTol=beat=>Math.max(0.09,0.25*beat); /* seconds */
/* taps and onsets in beats (already latency-corrected); returns per-onset result */
function tapGrade(q,taps){const beat=60/q.bpm,tol=tapTol(beat)/beat;const used=new Set();const per=q.onsets.map(o=>{let best=-1,bd=1e9;taps.forEach((t,i)=>{if(used.has(i))return;const d=Math.abs(t-o);if(d<bd){bd=d;best=i;}});if(best>=0&&bd<=tol){used.add(best);return {o,t:taps[best],off:(taps[best]-o)*beat*1000,ok:true};}return {o,t:null,off:null,ok:false};});

function tapTimeline(q,taps,r){const len=q.len,W=600,X0=20,BW=(W-40)/len,Y=36;let h=`<svg class="tl" viewBox="0 0 ${W} 72" role="img" aria-label="Timeline">`;
  for(let b=0;b<=len;b++){const x=X0+b*BW,click=b<len&&q.clicks.includes(b%4);h+=`<line class="tl-beat${click?' click':''}" x1="${x}" x2="${x}" y1="${Y-18}" y2="${Y+18}"/><text class="tl-num" x="${x}" y="${Y+32}">${b<len?b%4+1:''}</text>`;}
  for(let b=4;b<len;b+=4){const x=X0+b*BW;h+=`<line class="tl-bar" x1="${x}" x2="${x}" y1="${Y-24}" y2="${Y+24}"/>`;}
  q.onsets.forEach((o,i)=>{const x=X0+o*BW,res=r?r.per[i]:null;h+=`<circle class="tl-on${res?(res.ok?' ok':' miss'):''}" cx="${x}" cy="${Y}" r="7"/>`;});

  h+=`<line id="tapcur" class="tl-cur" x1="20" x2="20" y1="6" y2="66"/>`;return h+'</svg>';}

let TAP=null;
function tapBegin(){if(!S||S.locked||TAP)return;const q=S.q,g=G(S.gid);const go=()=>{if(!S||S.q!==q||S.locked)return;const beat=60/q.bpm,lead=0.25,total=q.countIn+(q.call?q.len:0)+q.len;
    const p0=performance.now()+lead*1000;TAP={q,p0,beat,taps:[],respStart:q.countIn+(q.call?q.len:0),end:total,raf:0};
    const clk=[];for(let i=0;i<total;i++){const inResp=i>=TAP.respStart,inCall=q.call&&i>=q.countIn&&i<TAP.respStart;const on=i<q.countIn||q.clicks.includes((i-q.countIn)%4);const drop=q.dropOut&&inResp&&(i-TAP.respStart)>=q.dropOut;if(on&&!drop){Piano.tick(lead+i*beat,(i-q.countIn)%4===0&&i>=q.countIn||i===0);clk.push((lead+i*beat)*1000);}}

const K=s=>{let h=5381;for(const ch of s)h=((h*33)^ch.codePointAt(0))>>>0;return 'k'+h.toString(36);};
const G=id=>{const g=STORE.games[id]||(STORE.games[id]=blank());if(!g.cf)g.cf=[];if(id==='fretboard'&&!g.v7){g.v7=1;if(g.lvl>=4)g.lvl=Math.min(7,g.lvl+1);if(g.last>=4)g.last=Math.min(7,g.last+1);const h={};Object.entries(g.hist).forEach(([L,v])=>h[+L>=4?+L+1:+L]=v);g.hist=h;Object.values(g.items).forEach(it=>{if(it.lv>=4)it.lv++;});g.sessions.forEach(ss=>{if(ss.L>=4)ss.L++;});}if(g.review===undefined)g.review=true;if(g.preview===undefined)g.preview=true;if(!g.round)g.round=12;if(g.sound===undefined)g.sound=true;if(!g.rk)g.rk={};return g;};

try{const s=JSON.parse(localStorage.getItem('fretwise-v1')||'null');if(s&&s.games)STORE=s;}catch(e){}
let DB=null,UID=null;
function setSync(ok){const el=document.getElementById('sync');el.classList.toggle('ok',ok);el.querySelector('span').textContent=ok?'Progress synced':'Saved on this device';}
let CLOUD_MSG='';
function setSyncMsg(t){const el=document.getElementById('sync');if(el){el.classList.remove('ok');el.querySelector('span').textContent=t;}}
const waitClaude=(ms)=>new Promise(res=>{const t0=Date.now();(function poll(){if(window.claude&&window.claude.use)return res(true);if(Date.now()-t0>ms)return res(false);setTimeout(poll,150);})();});
async function initCloud(attempt=0){try{if(!window.claude&&window.top===window){setSyncMsg('Saved in this browser');return;}setSyncMsg('Connecting…');if(!(await waitClaude(15000))){CLOUD_MSG='No cloud runtime in this view (saved on this device only).';setSyncMsg('Saved on this device');return;}
  const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);if(!user||!db){CLOUD_MSG='Cloud storage not available for this viewer.';setSyncMsg('Saved on this device');return;}
  const id=await user.id();if(!id){CLOUD_MSG='Could not identify the viewer.';setSyncMsg('Saved on this device');return;}DB=db;UID=id;const snap=await db.collection('data/users/'+id).get();let changed=false;

const LOBBY_NOTES={
 fretboard:'On the neck a fret has two names (C♯ is D♭); in a key it has only one. This game accepts either name; the theory games require the one the key calls for.',
 drop2:'Naming here: <b>from close</b> means which close-position inversion the voicing was dropped from (root, 1st, 2nd, 3rd). Drop-2 lowers the second voice from the top by an octave; the bass note follows from that. See the Reference page for the full sheet.',
 shells:'A <b>shell</b> is root, 7th and 3rd (the 5th is implied). <b>Drop-3</b> lowers the third voice from the top of a close voicing by an octave, which puts a skipped string between the bass and the rest.',
 triads:'Inversion is named by the bass note: root position, 1st inversion (3rd in the bass), 2nd inversion (5th in the bass). A major 3rd on the bottom means a major triad in root position or a minor triad in 1st inversion; a minor 3rd on the bottom means the reverse.',
 sing:'Sing on any vowel; any octave counts. The cadence sets the key: hear the tonic in your head before you sing. Three replays count as a hint.',
 cr:'Play the phrase straight back after the call. Pitches are graded in every level; in level 7 the timing is graded too (within a quarter of a beat of each swing slot).',
 arp:'Exact pitches inside the shaded position. Timed levels count a note only when it lands within a quarter of a beat of the click.',
 analysis:`<details class="lesson"><summary>Lesson notes: how to identify what you see</summary>
<p><b>1. Numerals (Berklee notation).</b> Count the chord root up the major scale of the key: 1 = I, 2 = II, 3 = III, 4 = IV, 5 = V, 6 = VI, 7 = VII; a root outside the scale takes ♭ or ♯ from the nearest degree (♭II, ♭III, ♯IV, ♭VI, ♭VII). Numerals are always upper case; the quality rides in the symbol: IIm7, V7, IMaj7, VIIm7♭5, ♯I°7.</p>
<p><b>2. Function.</b> Tonic = I, IIIm7, VIm7 (rest). Subdominant = IIm7, IVMaj7 (moving away). Dominant = V7, VIIm7♭5 (tension: they contain the leading tone and the 4th together, a tritone that wants to resolve).</p>
<p><b>3. Is it diatonic?</b> If the chord is not one of the seven diatonic chords, ask two questions: <i>what does it resolve to?</i> and <i>where could it have been borrowed from?</i></p>
<p><b>4. Secondary dominant (V7/x).</b> A dominant 7th on a degree other than V that moves down a 5th (or up a 4th) to a diatonic chord: VI7 → IIm7 is V7/II, II7 → V7 is V7/V, III7 → VIm7 is V7/VI, I7 → IVMaj7 is V7/IV. Test: the chord after it is a 5th below.</p>
<p><b>5. Tritone substitution (sub V7).</b> A dominant 7th a half step <i>above</i> its target: ♭II7 → IMaj7, ♭III7 → IIm7, ♭VI7 → V7. It shares the 3rd and 7th with the dominant it replaces (G7 and D♭7 both hold B and F). Test: dominant chord, root moves down a half step.</p>
<p><b>6. Backdoor dominant.</b> ♭VII7 going to IMaj7 (B♭7 → CMaj7), usually preceded by IVm7 (Fm7 – B♭7 – CMaj7). Test: dominant chord that rises a whole step into I.</p>
<p><b>7. Modal interchange (borrowed chords).</b> Chords lifted from the parallel minor: IVm7, ♭VIMaj7, ♭VIIMaj7 or ♭VII7, IIm7♭5, Im7. They sound darker and often carry ♭6 or ♭3 in the melody. Test: the chord belongs to the parallel minor key, and it does not behave as a dominant.</p>
<p><b>8. Diminished passing chord.</b> A °7 sitting between two diatonic chords a whole step apart: I – ♯I°7 – IIm7, IIm7 – ♯II°7 – IIIm7, IV – ♯IV°7 – V. Each is a rootless dominant 7♭9 of the chord it leads to (♯I°7 = VI7♭9 without its root). Test: diminished chord, bass moves by half step up into a diatonic chord.</p>
<p><b>9. Minor ii–V–i.</b> IIm7♭5 – V7(♭9) – Im7: the m7♭5 in front of a dominant tells you the target is minor.</p>
<p><b>Order of work:</b> write the key → write each root as a numeral → mark the qualities → circle anything non-diatonic → name it by what it resolves to.</p></details>`,
 voicelead:'Guide tones are the 3rd and 7th. From chord to chord they move by the smallest step: the 7th falls a half step to the next 3rd; the 3rd stays and becomes the next 7th.',

 keys:'Degrees are given as numbers. In analysis the Berklee notation IIm7, V7, IMaj7 carries the quality in the symbol, so the case of the numeral no longer matters.'};

function lineChart(vals,{min=0,max=100,fmt=v=>v,label=''}={}){const W=460,H=150,L=34,Rr=10,T=12,B=22,n=vals.length;if(n<2)return `<div class="empty">Play ${2-n} more round${n===1?'':'s'} to see the trend.</div>`;

      ${sp.length?`<div class="panel"><div class="eyebrow">Where you hesitate</div><div class="lvbars">${sp.slice(0,10).map(v=>`<div class="lvbar"><span><b>${esc(slotName(v.k))}</b></span><div class="track" title="${v.n} times"><i style="width:${Math.round(v.a/spMax*100)}%;background:${v===sp[0]?'var(--bad)':'var(--brass)'}"></i></div><span class="mono">${sec(v.a)} · ${v.n}</span></div>`).join('')}</div><p class="note">Average time to find the note in that slot${x.id==='hunt'?' (by string)':''}, slowest first.</p></div>`:''}
      ${taps.length>=2?`<div class="panel"><div class="eyebrow">Ahead of or behind the click (ms), last ${Math.min(40,taps.length)} takes</div>${lineChart(taps.slice(-40).map(e=>e.dr),{min:-120,max:120,fmt:v=>(v>0?'+':'')+Math.round(v),label:'Offset'})}<p class="note">Above 0 = behind the click (dragging), below = ahead (rushing). Within ±25 ms feels locked in.</p></div>`:''}
    </div></div>`;}
  else if(guitar)speed=`<div class="section"><h3>Speed on the guitar</h3><div class="panel empty">${x.mic?'Play a round':'Play a round in play mode (Answer by → Playing it)'} and this shows how fast you find each note, where you hesitate${x.mic?' and how you sit against the click':''}.</div></div>`;
  return `<div class="head"><div><div class="eyebrow">Statistics</div><h1>${x.name}</h1></div><div class="sp"><button class="btn ghost small" data-act="home">All games</button><button class="btn primary small" data-act="lobby" data-g="${x.id}">Play</button></div></div>
  ${g.n?`
  <div class="section"><h3>Teacher’s notes</h3><div class="tnotes">${notes.map(n=>`<div class="tnote ${n.tone}"><b>${n.title}</b><p>${n.body}</p></div>`).join('')}</div></div>
  <div class="big">
    <div class="tile"><span>Level</span><b>${g.lvl}/${x.levels.length}</b><small class="muted">${m.n?Math.round(m.p*100)+'% clean, last '+m.n:'not started'}</small></div>
    <div class="tile"><span>Recent accuracy</span><b>${r5n?pct(r5c,r5n)+'%':'—'}</b><small class="muted">last ${r5.length} rounds · lifetime ${pct(g.c,g.n)}%</small></div>
    ${plays.length?`<div class="tile"><span>${gpM!=null?'Per note':'First note'}</span><b>${sec(gpM??rtM)}</b><small class="muted">${gpM!=null&&rtM!=null?'first note '+sec(rtM)+' · ':''}median, played</small></div>`:guitar&&(x.mic||g.mode==='play')?`<div class="tile"><span>Playing speed</span><b>—</b><small class="muted">measured from your next played round</small></div>`:`<div class="tile"><span>Answer time</span><b>${sec(markMs)}</b><small class="muted">median per item</small></div>`}
    ${taps.length?`<div class="tile"><span>Against the click</span><b>${(()=>{const d=sMed(taps.slice(-20).map(e=>e.dr));return (d>0?'+':'')+Math.round(d)+' ms';})()}</b><small class="muted">+ = behind, − = ahead</small></div>`:''}
    <div class="tile"><span>Best streak</span><b>${g.best||0}</b><small class="muted">clean answers in a row</small></div>
    <div class="tile"><span>Practice</span><b>${Math.round(practiceMs(g)/60000)} min</b><small class="muted">${g.sessions.length} rounds · ${days} day${days===1?'':'s'} in 2 weeks</small></div>
  </div>
  <div class="section"><h3>Practise these next</h3><div class="panel tablewrap">${focus.length?`<table><thead><tr><th>Item</th><th>Why</th><th class="n">Clean</th><th class="n">Recent</th>${g.pn?'<th class="n">Played</th>':''}</tr></thead><tbody>${focus.map(w=>`<tr><td>${esc(w.l)}</td><td class="muted">${w.why.join(' · ')}</td><td class="n">${Math.round(w.acc*100)}% <span class="muted">of ${w.n}</span></td><td class="n mono">${(w.r||'').split('').map(c=>`<span style="color:${c==='1'?'var(--good)':'var(--bad)'}">${c==='1'?'●':'○'}</span>`).join('')||'·'}</td>${g.pn?`<td class="n">${w.qn?Math.round((w.qc||0)/w.qn*100)+'% ('+w.qn+')':'·'}</td>`:''}</tr>`).join('')}</tbody></table><p class="note">Ranked by misses (weighted toward recent ones) and slowness. Recent: last answers, newest on the right. Items you have answered cleanly three times running drop off.${guitar?' Played answers from before the new note detector (31 Oct) are left out: many of them were graded wrong.':''}</p>`:'<div class="empty">Nothing stands out: every item you have seen twice is clean and on pace.</div>'}</div></div>
  ${speed}
  <div class="section"><div class="two"><div class="panel"><div class="eyebrow">Accuracy per round</div>${lineChart(ss.map(s=>s.c/s.n*100),{fmt:v=>Math.round(v)+'%',label:'Accuracy per round'})}</div>
   <div class="panel"><div class="eyebrow">Average answer time per round</div>${(()=>{const v=ss.map(s=>s.ms/1000),mx=Math.max(5,Math.ceil(Math.max(...v,0)));return lineChart(v,{min:0,max:mx,fmt:t=>t.toFixed(0)+'s',label:'Average answer time'});})()}${guitar?'<p class="note">For played answers this includes the wait for listening to end; the speed section above measures the playing itself.</p>':''}</div></div></div>
  <div class="section"><h3>Levels</h3><div class="panel lvbars">${lvRows}<div class="legend"><span><i style="background:var(--brass)"></i>mastery (last ${20} clean answers)</span><span>Dashed line = ${PASS*100}% unlock mark</span><span>Right: lifetime accuracy · answers</span></div></div></div>
  ${special}
  ${conf.length?`<div class="section"><h3>Recurring mix-ups</h3><div class="panel tablewrap"><table><thead><tr><th>Correct → you said</th><th class="n">Times</th></tr></thead><tbody>${conf.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('')}</tbody></table></div></div>`:''}
  <div class="section"><h3>Recent rounds</h3><div class="panel tablewrap"><table><thead><tr><th>When</th><th class="n">Level</th><th>Mode</th><th class="n">Score</th><th class="n">Correct</th><th class="n">Avg</th><th class="n">Time</th></tr></thead><tbody>${g.sessions.slice(-10).reverse().map(s=>`<tr><td>${new Date(s.t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td class="n">${s.L}</td><td class="muted">${s.mode==='play'?'played':'marked'}</td><td class="n">${s.sc||0}</td><td class="n">${s.c}/${s.n}</td><td class="n">${(s.ms/1000).toFixed(1)}s</td><td class="n">${s.dur>roundCap(s)?'<span class="muted" title="left open">—</span>':fmtClock(s.dur)}</td></tr>`).join('')}</tbody></table></div></div>`
  :`<div class="panel empty">No rounds played yet. <button class="btn primary small" data-act="lobby" data-g="${x.id}">Play level 1</button></div>`}
  <div class="section"><div class="confirm" id="resetbox">${view.confirm?`<b>Erase all ${x.name} progress?</b> <button class="btn small" data-act="reset-yes">Erase</button><button class="btn small ghost" data-act="reset-no">Keep it</button>`:`<button class="btn small ghost" data-act="reset">Reset ${x.name} progress</button>`}</div></div>`;}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{const hit=e.target.closest('.fb-hit');
  if(hit&&view.name==='lobby'&&hit.closest('#refneck')){const w=OPEN[+hit.dataset.s]+(+hit.dataset.f)+12;if(NAT.indexOf(w%12)>=0){const st=(Math.floor(w/12)-5)*7+NAT.indexOf(w%12)-2;view.ref=view.ref===st?null:st;render();}return;}if(hit&&S&&!S.locked&&view.name==='play'&&S.q.ui==='multi'){const k=hit.dataset.s+'-'+hit.dataset.f;if(S.sel.has(k))S.sel.delete(k);else S.sel.add(k);render();return;}
  if(hit&&S&&!S.locked&&view.name==='play'){answer({s:+hit.dataset.s,f:+hit.dataset.f});return;}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;if((a==='mix'||a==='sound')&&e.target!==b)return;
  if(a==='home'){if(view.name==='play')return quit();if(REC)recStop(true);view={name:'home'};render();window.scrollTo(0,0);}
  else if(a==='lobby'){view={name:'lobby',gid:b.dataset.g};render();window.scrollTo(0,0);}
  else if(a==='stats'){view={name:'stats',gid:b.dataset.g};render();window.scrollTo(0,0);}
  else if(a==='sel'){view.sel=+b.dataset.l;render();}
  else if(a==='nmap'){view.nmap=b.dataset.k;render();}
  else if(a==='refsel'){const st=b.dataset.st==='none'?null:+b.dataset.st;view.ref=view.ref===st?null:st;render();}
  else if(a==='limit'){G(view.gid).limit=b.dataset.k;saveLocal();render();}
  else if(a==='start')start(view.gid,view.sel);
  else if(a==='again'){start(S.gid,S.unlocked||S.L);}
  else if(a==='ans'){const q=S.q;let v=b.dataset.v;if(q.ui==='pc')v=+v;else if(q.ui==='letters')v=v+ACC[S.acc];answer(v);}
  else if(a==='acc'){S.acc=+b.dataset.a;document.querySelectorAll('[data-act="acc"]').forEach(x=>x.classList.toggle('on',+x.dataset.a===S.acc));}
  else if(a==='hint'){S.hinted=true;render();tick();}
  else if(a==='next')nextQ();
  else if(a==='replay')replayAudio();
  else if(a==='replaydone'){if(Piano.ready)S.q.audio();}
  else if(a==='hearsnd')replaySnd();
  else if(a==='listen')micListen();
  else if(a==='tapstart')tapBegin();
  else if(a==='tap'){}
  else if(a==='resetlat'){const g=G(view.gid);g.opts=g.opts||{};g.opts.lat=0;saveGame(view.gid);render();}
  else if(a==='stop')stopListening();
  else if(a==='tuner'){if(REC)recStop(true);tuner();}
  else if(a==='rec')openRec();
  else if(a==='recgo')recStart(b.dataset.id);
  else if(a==='recstop')recStop();
  else if(a==='fixsend')fixSend(b.dataset.id);
  else if(a==='fixlist')openFix();
  else if(a==='fixdel')FIXDB.del(+b.dataset.id).then(openFix);
  else if(a==='savetake'&&LAST_TAKE&&S)wavSave(LAST_TAKE.x,LAST_TAKE.sr,`fretwise-${S.q.key}-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.wav`);
  else if(a==='micopt'){const g=G(view.gid);g.opts=g.opts||{};const k=b.dataset.k;if(b.type==='checkbox')g.opts[k]=b.checked;else g.opts[k]=isNaN(+b.value)?b.value:+b.value;saveGame(view.gid);render();}
  else if(a==='export'){view.export=!view.export;render();}
  else if(a==='importbox'){view.importbox=!view.importbox;render();}
  else if(a==='copyexport'){const ta=document.getElementById('exportta');const done=()=>{document.getElementById('copymsg').textContent='Copied.';};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.select();done();});else{ta.select();done();}}
  else if(a==='doimport'){try{const inc=JSON.parse(document.getElementById('importta').value);if(!inc||!inc.games)throw 0;let k=0;Object.entries(inc.games).forEach(([id,g])=>{if(!GBY[id])return;const cur=STORE.games[id];if(!cur||(g.n||0)>=(cur.n||0)){STORE.games[id]=g;k++;saveGame(id);}});saveLocal();view.importmsg=`Imported ${k} game${k===1?'':'s'}.`;view.importbox=true;render();}catch(e){view.importmsg='That text is not a Fretwise export.';render();}}
  else if(a==='round'){G(view.gid).round=+b.dataset.k;saveGame(view.gid);render();}
  else if(a==='mode'){const g=G(view.gid);g.mode=b.dataset.k;saveGame(view.gid);if(g.mode==='play')Piano.load();render();}
  else if(a==='sound'){const g=G(view.gid);g.sound=!g.sound;saveGame(view.gid);render();}
  else if(a==='mix'){const g=G(view.gid);g[b.dataset.k]=!g[b.dataset.k];saveGame(view.gid);render();}
  else if(a==='overview'){view={name:'overview'};render();window.scrollTo(0,0);}
  else if(a==='reference'){view={name:'reference'};render();window.scrollTo(0,0);}
  else if(a==='cat'){view={name:'home',cat:b.dataset.c};render();}
  else if(a==='submit')answer(selArr());
  else if(a==='clear'){S.sel.clear();render();}
  else if(a==='quit')quit();
  else if(a==='reset'){view.confirm=true;render();}
  else if(a==='reset-no'){view.confirm=false;render();}
  else if(a==='reset-yes'){STORE.games[view.gid]=blank();view.confirm=false;saveGame(view.gid);render();}
});
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-act="tap"]');if(b){e.preventDefault();tapHit();}});
document.addEventListener('change',e=>{const b=e.target;if(b.dataset&&b.dataset.act==='micopt'&&b.tagName==='SELECT'){const g=G(view.gid);g.opts=g.opts||{};g.opts[b.dataset.k]=isNaN(+b.value)?b.value:+b.value;saveGame(view.gid);render();}});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('fixin'))clearTimeout(autoT);});   // writing a report pauses the auto-advance
/* a correct answer has no Next button: once the box is left empty (or the report is sent) it moves on by itself again */
const fixResume=()=>{if(view.name==='play'&&S&&S.locked){const l=S.answers.at(-1);if(l&&l.ok&&!l.hinted){clearTimeout(autoT);autoT=setTimeout(()=>{const el=document.activeElement;if(!(el&&el.classList&&el.classList.contains('fixin')&&el.value.trim()))nextQ();},1400);}}};
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('fixin')&&!e.target.value.trim())fixResume();});
document.addEventListener('keydown',e=>{if(e.target.classList&&e.target.classList.contains('fixin')){if(e.key==='Enter'){e.preventDefault();fixSend(e.target.id);}return;}
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(view.name!=='play'||!S||e.metaKey||e.ctrlKey||e.altKey)return;const q=S.q,k=e.key;
  if(S.locked){if(k==='Enter'||k===' '){e.preventDefault();nextQ();}return;}
  if(q.ui==='multi'){if(k==='Enter'){e.preventDefault();answer(selArr());}else if(k==='Backspace'){S.sel.clear();render();}else if(k==='h'||k==='H'){if(!S.hinted)document.querySelector('[data-act="hint"]')?.click();}return;}
  if(k==='h'||k==='H'){if(!S.hinted)document.querySelector('[data-act="hint"]')?.click();return;}
  if(k==='p'||k==='P'){if(q.audio)replayAudio();return;}
  if(q.ui==='mic'&&k===' '){e.preventDefault();if(S.listening)stopListening();else micListen();return;}
  if(q.ui==='tap'&&k===' '){e.preventDefault();if(e.repeat)return;if(TAP)tapHit();else tapBegin();return;}
  if(q.ui==='choices'&&/^[1-9]$/.test(k)){const i=+k-1;if(i<q.choices.length)answer(q.choices[i]);return;}
  if(q.ui==='letters'||q.ui==='pc'){if(k==='['||k==='-'){S.acc=-1;render();return;}if(k===']'||k==='='||k==='#'){S.acc=1;render();return;}if(k==='0'){S.acc=0;render();return;}
    const L=k.toUpperCase();if('CDEFGAB'.includes(L)&&L.length===1){if(q.ui==='letters')answer(L+ACC[S.acc]);else answer(mod(NAT[LET.indexOf(L)]+S.acc,12));}}
});
render();initCloud();document.getElementById('sync').addEventListener('click',()=>{if(!DB)initCloud();});
</script>
