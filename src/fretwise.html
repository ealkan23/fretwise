<meta charset="utf-8">
<title>Fretwise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Chivo:wght@400;600;700&family=Chivo+Mono:wght@500&family=Noto+Music&display=swap">
<style>
/* Layout: amp-panel app shell — condensed caps labels, brass meters, one working surface per view */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunk:#E2E5E9; --line:#CDD2D8; --fg:#15181C; --muted:#5B636D;
  --brass:#B47B1A; --brass-ink:#8A5A0B; --brass-soft:#F3E3C2;
  --good:#1E8556; --good-soft:#DDF1E6; --bad:#C23E2B; --bad-soft:#F8E0DB; --live:#D23B3B;
  --wood:#3A2A22; --wood-line:#B9B2A8; --pearl:#E9E4DA; --string:#C9C3B6;
  --o3:#2F6DB5; --o4:#1E8556; --o5:#B47B1A; --o6:#B03A6A;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Chivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Chivo Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-music:"Noto Music","Segoe UI Symbol","Apple Symbols",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D20; --sunk:#23272B; --line:#30353B; --fg:#ECEEF0; --muted:#9AA2AB;
  --brass:#E1A73E; --brass-ink:#EDBB5F; --brass-soft:#3A2E17;
  --good:#3DBB7E; --good-soft:#173527; --bad:#EE6A55; --bad-soft:#3E1F1A;
  --wood:#2A1D17; --wood-line:#6E655B; --pearl:#CFC8BA; --string:#A9A193; --o3:#5E9BE6; --o4:#3DBB7E; --o5:#E1A73E; --o6:#E06A9A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --sunk:#23272B; --line:#30353B; --fg:#ECEEF0; --muted:#9AA2AB;
  --brass:#E1A73E; --brass-ink:#EDBB5F; --brass-soft:#3A2E17;
  --good:#3DBB7E; --good-soft:#173527; --bad:#EE6A55; --bad-soft:#3E1F1A;
  --wood:#2A1D17; --wood-line:#6E655B; --pearl:#CFC8BA; --string:#A9A193; --o3:#5E9BE6; --o4:#3DBB7E; --o5:#E1A73E; --o6:#E06A9A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.topnav{display:flex;gap:4px;margin-right:auto}
#castlebg{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
html.castle{background:#07061a}html.castle body{background:transparent}html.castle .top{background:rgba(10,9,30,.84);backdrop-filter:blur(3px)}@media (max-width:560px){.top .sync span,.top .mic span{display:none}.brand{font-size:21px}.topnav button{padding:6px 6px}}.topnav button{font:inherit;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;color:var(--muted);cursor:pointer}
.topnav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}.topnav button:focus-visible{outline:2px solid var(--fg)}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;padding:0}
.brand span{color:var(--brass)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:var(--brass-ink);border-color:var(--brass-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* home */
.hero{padding-block:28px 20px;display:grid;gap:8px}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:800}
.hero p{margin:0;max-width:66ch;color:var(--muted)}
.overall{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:8px;align-items:end}
.overall div{display:grid}
.overall b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:26px;font-weight:800}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .row{display:flex;gap:8px;margin-top:auto}
.card .row .btn{flex:1}
.pips{display:flex;gap:4px;align-items:center}
.pips i{width:22px;height:8px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.pips i.on{background:var(--brass);border-color:var(--brass)}
.pips span{margin-left:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.kv{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.kv b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
/* lobby */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding-block:24px 16px}
.head h1{font-size:clamp(30px,5vw,44px);font-weight:800}
.head .sp{margin-left:auto;display:flex;gap:8px}
.ladder{display:grid;gap:8px}
.formchart{display:flex;flex-wrap:wrap;gap:6px}.formchart .fbar{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-weight:600;min-width:52px;text-align:center}.formchart .fbar small{display:block;font-weight:400;color:var(--muted);font-size:10px}
.rhylines svg{display:block}
.gtl{width:100%;height:110px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gbars{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.gbar{flex:1;min-width:260px}.gbar.next{opacity:.55;transform:scale(.85);transform-origin:left top}.gchord{font-family:var(--f-display);font-weight:800;font-size:26px}.gholdwrap{display:grid;gap:4px}.gholdwrap .bar2{position:relative;display:block;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}.gholdwrap .bar2 i{display:block;height:100%;background:var(--brass)}.gholdwrap .bar2 i.good{background:var(--good)}.gstats .tile b.good{color:var(--good)}.gstats .tile b.bad{color:var(--bad)}.tok.music{padding:6px 10px}.tok.music svg.cell,.spellslots.music .slot .n svg.cell,.tokseq svg.cell{height:38px;width:auto;display:inline-block;vertical-align:middle;max-width:none}.spellslots.music .slot .s svg.cell{height:26px;width:auto;display:inline-block;max-width:none;opacity:.8}.tokseq{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}.tokseq svg.cell{height:30px}.st-dotd{fill:var(--fg)}.st-flag{fill:var(--fg)}
.rung{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.rung.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.rung.locked{opacity:.55}
.rung .lv{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;text-align:center}
.rung .lv small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.rung b{font-weight:700}
.rung .d{color:var(--muted);font-size:13px;min-width:0}
.meter2{display:grid;gap:7px;font-size:11px;color:var(--muted);justify-items:end}.mrow{display:grid;grid-template-columns:132px 132px 48px;gap:0 14px;align-items:start}.mrow.lab{grid-template-columns:48px 132px 132px 48px}
.mlab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;align-self:center}.mrow.cur .mlab{color:var(--fg);font-weight:700}.mrow.off .moff{grid-column:2/-1;align-self:center;font-style:italic}
.meter2 .ml{display:block;white-space:nowrap}.meter2 .ml b{color:var(--fg);font-weight:700}.meter2 .bar2{position:relative;display:block;height:6px;border-radius:3px;background:var(--sunk);margin-top:4px}
.meter2 .bar2 i{display:block;height:100%;border-radius:3px;background:var(--brass)}.meter2 .bar2 i.good{background:var(--good)}
.meter2 .bar2 u{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;background:var(--fg);opacity:.55;border-radius:1px}.meter2 .bar2 u.std{background:var(--good);opacity:1}
.meter2 .mg{display:block;margin-top:3px;font-size:10px;white-space:nowrap;opacity:.85}.meter2 .mb.dim .ml b,.meter2 .mb.dim .bar2 i{opacity:.5}.meter2 .mn{display:grid;justify-items:end;line-height:1.1}.meter2 .mn b{font-size:16px;color:var(--fg)}.meter2 .mcap{text-align:right}
.meter{width:110px;display:grid;gap:4px;justify-items:end;font-size:11px;color:var(--muted)}
.meter .bar{width:100%;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--brass)}
.setup{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--fg);color:var(--bg)}
.note{font-size:13px;color:var(--muted);max-width:60ch;margin:6px 0 0}
/* play */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:16px 10px}
.hud .t{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase}
.hud .stat{font-size:12px;color:var(--muted);display:grid;line-height:1.2}
.hud .stat b{font-family:var(--f-mono);color:var(--fg);font-size:17px;font-weight:500}
.hud .sp{margin-left:auto;display:flex;gap:18px;align-items:center}
.clockbar{display:flex;align-items:center;height:40px;margin:2px 0 6px}.clockbar[hidden]{display:none}
.hp-heart{width:42px;height:38px;flex:none;margin-right:-9px;position:relative;z-index:2;filter:drop-shadow(0 0 1px #000)}
.hp-track{flex:1;position:relative;height:20px;background:#ececec;box-shadow:0 0 0 3px #000,0 0 0 7px rgba(0,0,0,.72);margin:0 16px 0 0}
.hp-track::after{content:'';position:absolute;right:-14px;top:-3px;width:14px;height:26px;background:#000;clip-path:polygon(0 0,34% 0,34% 18%,67% 18%,67% 36%,100% 36%,100% 64%,67% 64%,67% 82%,34% 82%,34% 100%,0 100%)}
.hp-track::before{content:'';position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.85) 30px 33px)}
.clockbar i{display:block;height:100%;width:100%;position:relative;background:#3ecf2f;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.clockbar i::before{content:'';position:absolute;left:4px;right:4px;top:3px;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 18px,transparent 18px 33px)}
.clockbar[data-hp="y"] i{background:#ffd21f}.clockbar[data-hp="o"] i{background:#ff7a1a}.clockbar[data-hp="r"] i{background:#e8261f}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:12px;display:grid;gap:18px;position:relative;z-index:1}
.hud,.clockbar{position:relative;z-index:2}body.onfire .hud{text-shadow:0 0 3px #000,0 1px 2px #000,0 0 8px #000}
.firecv{position:absolute;z-index:0;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges}
.firebadge{position:absolute;z-index:2;pointer-events:none;width:168px;height:234px}body.onfire .gprompt{padding-right:170px}.firebadge canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.fb-txt{position:absolute;left:0;right:0;bottom:30px;display:grid;justify-items:center;line-height:.9;color:#fff;text-shadow:0 0 2px #000,2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000}
.fb-txt b{font-family:var(--f-display);font-weight:800;font-size:64px;letter-spacing:.02em}.fb-txt span{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.24em;text-transform:uppercase;margin-top:4px}
.qtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.review{background:var(--brass-soft);color:var(--brass-ink)}
.chip.stretch{background:var(--fg);color:var(--bg)}
.prompt{font-size:clamp(19px,2.6vw,24px);line-height:1.35;max-width:60ch}
.prompt .notes{font-family:var(--f-mono);font-size:.95em;white-space:nowrap}
.visual{overflow-x:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px;font-size:16px;min-width:0}
.choice kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface)}
.choice:hover:not([disabled]){border-color:var(--fg)}
.choice.right,.key.right{background:var(--good-soft);border-color:var(--good)}
.choice.wrong,.key.wrong{background:var(--bad-soft);border-color:var(--bad)}
.choice[disabled],.key[disabled]{cursor:default}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.keys.pc{grid-template-columns:repeat(6,1fr)}
.key{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 4px;font-weight:700;font-size:17px;font-family:var(--f-body)}
.key:hover:not([disabled]){border-color:var(--fg)}
.key.sharp{font-size:13px}
.accrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.accrow .seg button{font-family:var(--f-music);font-size:17px;padding:4px 16px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .sp{margin-left:auto}
.hintbox{font-size:14px;background:var(--brass-soft);color:var(--fg);border-radius:8px;padding:10px 12px}
.fb-panel{border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.fb-panel.ok{background:var(--good-soft)}
.fb-panel.no{background:var(--bad-soft)}
.fb-panel .v{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.fb-panel.ok .v{color:var(--good)} .fb-panel.no .v{color:var(--bad)}
.fb-panel p{margin:0}
.fb-panel .row{display:flex;justify-content:flex-end}
/* fretboard svg */
svg.fb{width:100%;min-width:560px;max-width:680px;display:block}
.fb-wood{fill:var(--wood)}
.fb-fret{stroke:var(--wood-line);stroke-width:2}
.fb-nut{fill:var(--pearl)}
.fb-inlay{fill:var(--pearl);opacity:.75}
.fb-str{stroke:var(--string)}
.fb-lab{fill:var(--muted);font:600 11px var(--f-body)}
.fb-num{fill:var(--muted);font:500 10px var(--f-mono);text-anchor:middle}
.fb-hit{fill:transparent;cursor:pointer}
.fb-hit:hover{fill:var(--brass);fill-opacity:.25}
.fb-mark{fill:var(--brass);stroke:var(--surface);stroke-width:2}
.fb-ok{fill:var(--good);stroke:var(--surface);stroke-width:2}
.fb-no{fill:var(--bad);stroke:var(--surface);stroke-width:2}
svg.fb circle,svg.fb text{pointer-events:none}
.fb-win{fill:var(--brass);fill-opacity:.16;stroke:var(--brass);stroke-width:1.5;stroke-dasharray:5 3}
.fb-alt{fill:none;stroke:var(--pearl);stroke-width:2;stroke-dasharray:3 2}
.staffwrap{margin-bottom:6px}
.fb-miss{fill:var(--good);fill-opacity:.4;stroke:var(--pearl);stroke-width:2;stroke-dasharray:3 2}
.fb-dot-t{fill:#fff;font:700 10px var(--f-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
/* staff svg */
svg.staff{width:100%;max-width:360px;display:block}
.st-line{stroke:var(--fg);stroke-width:1.3}
.st-glyph{fill:var(--fg);font-family:var(--f-music)}
.st-head{fill:none;stroke:var(--fg);stroke-width:3}
.st-acc line{stroke:var(--fg);stroke-width:1.3}
.st-acc line.bar{stroke-width:2.6}
.st-acc .bowl{fill:none;stroke:var(--fg);stroke-width:2.2}
.st-head.ok{stroke:var(--good)}
.st-head.fill{fill:var(--fg);stroke-width:1.2}.st-head.fill.ok{fill:var(--good)}.st-stem{stroke:var(--fg);stroke-width:1.8}.st-beam{stroke:var(--fg);stroke-width:5}.st-ts{fill:var(--fg);font:700 22px var(--f-sans,sans-serif)}
/* chord boxes */
.boxes{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
svg.box{display:block;max-width:100%;height:auto}
.bx-fret{stroke:var(--line);stroke-width:1.2}
.bx-nut{stroke:var(--fg);stroke-width:4}
.bx-str{stroke:var(--muted);stroke-width:1}
.bx-num{fill:var(--muted);font:500 9px var(--f-mono);text-anchor:end}
.bx-x{fill:var(--muted);font:600 12px var(--f-body);text-anchor:middle}
.bx-open{fill:none;stroke:var(--fg);stroke-width:1.4}
.bx-dot{fill:var(--brass)}
.bx-lab{fill:var(--surface);font:700 8.5px var(--f-body);text-anchor:middle;dominant-baseline:central}
.bx-olab{fill:var(--brass-ink);font:700 8px var(--f-body);text-anchor:middle}
.bx-title{fill:var(--fg);font:700 12px var(--f-body);text-anchor:middle}
.bx-arrow{color:var(--muted);font-size:18px}
/* staff-fretboard map */
.refmap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;display:grid;gap:10px;min-width:0}
.refhead{display:grid;gap:6px}.refhead h3{font-size:20px;font-weight:800}
.refscroll{overflow-x:auto}
svg.refstaff{display:block;max-width:none}
.refn{cursor:pointer}.refn.dim{opacity:.28}.refn:focus-visible{outline:none}.refn:focus-visible ellipse{stroke:var(--fg);stroke-width:2}
.ref-lab{font:700 11px var(--f-body);text-anchor:middle}
.ref-open{fill:var(--muted);font:500 8px var(--f-mono);text-anchor:middle}
.ref-sel{fill:var(--brass);fill-opacity:.12;stroke:var(--brass);stroke-width:1.2}
.o3f{fill:var(--o3)}.o4f{fill:var(--o4)}.o5f{fill:var(--o5)}.o6f{fill:var(--o6)}
.o3t{fill:var(--o3)}.o4t{fill:var(--o4)}.o5t{fill:var(--o5)}.o6t{fill:var(--o6)}
.legend i.o3b{background:var(--o3)}.legend i.o4b{background:var(--o4)}.legend i.o5b{background:var(--o5)}.legend i.o6b{background:var(--o6)}
svg.fb circle.dim,svg.fb text.dim{opacity:.18}
#refneck .fb-dot-t{font-size:8.5px;fill:var(--surface)}
#refneck svg.fb circle[class^="o"]{stroke:var(--wood);stroke-width:1.5}
.nm-nat{fill:var(--brass);stroke:var(--wood);stroke-width:1.5}
.nm-acc{fill:var(--pearl);stroke:var(--wood);stroke-width:1.5}
#notemap .fb-dot-t{font-size:9px;fill:var(--surface)}
#notemap .fb-dot-t.nm-acct{fill:var(--wood);font-size:8px}
#notemap .seg{justify-self:start}
/* categories, listening cards */

const PROG_NOTES={'vi – IV – I – V':'The pop loop started from VIm: the same four chords as I–V–VIm–IV, rotated.','I – ♭VII – IV – I':'Mixolydian rock: ♭VII is borrowed from the parallel minor; the bass moves by steps and 4ths.','I – vi – IV – ii':'Falling 3rds all the way: I, VIm, IV, IIm share two notes with their neighbours.','IV – V – iii – vi':'The “royal road”: IV–V then a deceptive IIIm–VIm; the bass moves a step, a 3rd down, a 4th up.','I – V – vi – iii | IV – I – IV – V':'Pachelbel: a descending 3rds sequence, I–V–VIm–IIIm, then IV–I–IV–V back home.','vi – ii – V – I':'Pure cycle of 4ths: every root rises a 4th (falls a 5th) into the next.','iii – vi – ii – V':'The turnaround as a cycle of 4ths starting on IIIm.','I – ii – iii – IV':'Stepwise: the bass walks up the scale.','I – ♭VII – ♭VI – ♭VII':'Stepwise with borrowed chords: the Aeolian rock move.','ii – V – I':'The bass falls in 5ths: minor, dominant, home.','I – vi – IV – V':'The 50s progression: home, the relative minor, then IV–V pulls back.','I – V – vi – IV':'The pop loop: V goes up to VIm instead of home (a deceptive move).','I – IV – V – I':'Plain: subdominant, dominant, home.','ii – ♭II7 – I':'The tritone sub shares the 3rd and 7th of V7; the bass walks down by half step: D – D♭ – C.','iv – ♭VII7 – I':'Backdoor: IVm7 and ♭VII7 come from the parallel minor and resolve up a whole step.','I – VI7 – ii – V':'VI7 is V7 of IIm7: a dominant where the diatonic VIm7 would be minor.','i – iv – V7 – i':'Minor with a major V7, which uses the raised 7th of harmonic minor.','i – VI – III – VII':'Natural minor only: all diatonic, so it sounds like the relative major.','ii° – V7 – i':'The minor II–V: half-diminished (as a triad, diminished) to V7.','i – ♭VII – ♭VI – V7':'Andalusian cadence: the bass walks down by step to V.','I – ♯i°7 – ii – ♯ii°7':'Diminished passing chords fill the half steps between I, IIm and IIIm.','I – ♭III7 – ♭VI7 – ♭II7':'Each dominant is a tritone sub of the usual VI7–II7–V7 chain.','I function playBluesCadence(root){const t=pc(root);const dom=r=>({pcs:[0,4,7,10].map(x=>mod(r+x,12)),bass:r});return playChords([dom(t),dom(mod(t+5,12)),dom(t),dom(mod(t+7,12))],0.7);}

    spots.sort((a,b)=>a.m-b.m||b.s-a.s);const uniq=[];spots.forEach(x=>{if(!uniq.length||uniq.at(-1).m!==x.m)uniq.push(x);});const startAt=uniq.findIndex(x=>x.i===startIdx);if(startAt<0||uniq.length-startAt<len)continue;let seq=uniq.slice(startAt,startAt+len);if(desc)seq=seq.concat(seq.slice(0,-1).reverse());return {seq,win};}return null;}
const MODE7=[['Ionian',0,'maj7'],['Dorian',1,'m7'],['Phrygian',2,'m7'],['Lydian',3,'maj7'],['Mixolydian',4,'7'],['Aeolian',5,'m7'],['Locrian',6,'m7♭5']];

  return M({key:`md-${nm(root)}-${name}`,label:`${nm(root)} ${name} in position`,target:a.seq.map(x=>x.m),octaveFree:false,maxNotes:8,

function bebopRun(){return ()=>{for(let t=0;t<60;t++){const root=P(rootPick(['C','F','G','D','A','E','Bb','Eb'])),mix=modeNotes(root,4,'maj');if(!okAcc(mix,2))continue;

function iiVIof(k){const root=P(k),ii=tr(root,2,2),V=tr(root,5,7);return {root,ii,V,chs:[{r:ii,q:'m7'},{r:V,q:'7'},{r:root,q:'maj7'}]};}

function singBassLine(){return ()=>{const k=rootPick(MKEYLIST),x=iiVIof(k),t=tonic4(x.root),mids=[t+2,t+7,t],names=[nm(x.ii),nm(x.V),nm(x.root)];

function crChordPhrase(){const o=micOpt(),k=rootPick(MKEYLIST),root=P(k),[q,mi]=R([['7',4],['m7',1],['maj7',0]]),sc=modeNotes(root,mi,'maj'),t=MKEYS[k]+12;const scM=sc.map(n=>t+mod(pc(n)-pc(root),12)).concat(sc.map(n=>t+12+mod(pc(n)-pc(root),12))).sort((a,b)=>a-b);

/* ============ PHRASING (Nov 2026): bends, vibrato, blues phrases, double stops ============ */
/* Bends & vibrato are graded from the pitch curve (YIN, ~60 frames a second, cents from the fretted note). Checked against synthetic
   curves (tests/bend_check.js); not yet against recordings of the user's bends: the Mic check recorder has takes for that. */
const BEND={tol:20,holdMs:250,relTol:30,relMs:150,preTol:35,vibRate:[4,8],vibWidth:[25,120],bvWidth:[15,100]};
const BEND_KIND={half:{n:'half-step bend',c:100},whole:{n:'whole-step bend',c:200},release:{n:'bend and release',c:200},prebend:{n:'pre-bend and release',c:200},vibrato:{n:'vibrato',c:0},bendvib:{n:'bend with vibrato',c:200},curl:{n:'quarter-tone curl',c:50}};
/* curve: [{t ms, m float midi}] of the voiced frames; start: the fretted midi. Pure (also run by the tests). */
function bendAnalyse(curve,start,kind){const K=BEND_KIND[kind],steps=K.c,med=a=>{const b=a.slice().sort((x,y)=>x-y);return b.length?b[b.length>>1]:null;};
  let pts=curve.filter(p=>p.m!=null).map(p=>({t:p.t,c:(p.m-start)*100}));if(pts.length<8)return {ok:false,why:'No steady note was heard.',pts};
  const m0=med(pts.map(p=>p.c));pts=pts.filter(p=>Math.abs(p.c-m0)<700&&p.c>-200&&p.c<steps+300);            // octave slips out
  const sm=pts.map((p,i)=>({t:p.t,c:med(pts.slice(Math.max(0,i-2),i+3).map(q=>q.c))})),t0=sm.length?sm[0].t:0;sm.forEach(p=>p.t-=t0);
  if(sm.length<8)return {ok:false,why:'No steady note was heard.',pts:sm};
  const base=kind==='prebend'?0:med(sm.slice(0,6).map(p=>p.c)),rel=sm.map(p=>({t:p.t,c:p.c-base})),dur=rel.at(-1).t,
    raw=pts.map((p,i)=>({t:sm[i].t,c:p.c-base}));   // unsmoothed: vibrato width is measured on this (smoothing flattens the peaks)
  /* the longest stretch within tol of a target, in ms */
  const run=(tgt,tol,from=0)=>{let best=0,bs=-1,be=-1,st=null;for(let i=from;i<rel.length;i++){if(Math.abs(rel[i].c-tgt)<=tol){if(st===null)st=i;const d=rel[i].t-rel[st].t;if(d>best){best=d;bs=st;be=i;}}else st=null;}return {ms:best,i0:bs,i1:be};};
  /* vibrato on rel[a..b]: subtract a ±400 ms moving average (longer than one cycle down to 2 per second), count crossings */
  const vib=(a,b)=>{const seg=raw.slice(a,b+1);if(seg.length<20)return null;const T=(seg.at(-1).t-seg[0].t)/1000,w=Math.max(3,Math.round(seg.length/T*0.4));
    const d=seg.map((p,i)=>p.c-seg.slice(Math.max(0,i-w),i+w+1).reduce((x,y)=>x+y.c,0)/(Math.min(seg.length,i+w+1)-Math.max(0,i-w)));let z=0;for(let i=1;i<d.length;i++)if((d[i-1]<0)!==(d[i]<0))z++;
    const rms=Math.sqrt(d.reduce((x,y)=>x+y*y,0)/d.length);return {rate:z/2/T,width:2*Math.SQRT2*rms,dur:T*1000};};
  const out={kind,steps,base:Math.round(base),dur:Math.round(dur),pts:rel};
  if(kind==='vibrato'){const i=rel.findIndex(p=>p.t>=200),v=vib(i<0?0:i,rel.length-1);if(!v||v.dur<1200)return {...out,ok:false,why:'Hold the note longer: at least 1.5 s with vibrato.'};
    Object.assign(out,{rate:v.rate,width:v.width});out.ok=v.rate>=BEND.vibRate[0]&&v.rate<=BEND.vibRate[1]&&v.width>=BEND.vibWidth[0]&&v.width<=BEND.vibWidth[1];
    out.why=out.ok?'Even vibrato.':v.width<10?'No vibrato heard: move the string, rocking from the wrist.':v.width<BEND.vibWidth[0]?'Too narrow: push the string further (aim for about a quarter tone).':v.width>BEND.vibWidth[1]?'Too wide: smaller, controlled movements.':v.rate<BEND.vibRate[0]?'Too slow: speed it up a little.':'Too fast: relax it, about 5–6 cycles a second.';return out;}
  if(kind==='prebend'){const first=med(rel.slice(0,6).map(p=>p.c));out.first=Math.round(first);
    const top=Math.abs(first-steps)<=BEND.preTol,downAt=rel.findIndex((p,i)=>i>6&&Math.abs(p.c-0)<=BEND.preTol),down=downAt>0&&run(0,BEND.preTol,downAt).ms>=BEND.relMs;
    out.ok=top&&down;out.why=!top?`Start already bent to the target before you pick: the first pitch was ${Math.round(first)} cents above the fret, the target is ${steps}.`:!down?'Then let it down to the fretted pitch, cleanly.':'Pre-bend in tune and released.';return out;}
  const r=run(steps,BEND.tol),peak=Math.max(...rel.map(p=>p.c));out.peak=Math.round(peak);out.holdMs=Math.round(r.ms);
  out.plateau=r.ms>0?Math.round(med(rel.slice(r.i0,r.i1+1).map(p=>p.c))):null;
  const reached=r.ms>=BEND.holdMs,top=reached?out.plateau:Math.round(med(rel.filter(p=>p.c>=peak-25).map(p=>p.c)));out.top=top;
  const miss=reached?'':top<steps?`The bend stopped short: ${top} cents (target ${steps}). Push a little further.`:`The bend went sharp: ${top} cents (target ${steps}). Ease off.`;
  if(kind==='release'){const back=reached?rel.findIndex((p,i)=>i>r.i1&&Math.abs(p.c)<=BEND.relTol):-1,rok=back>0&&run(0,BEND.relTol,back).ms>=BEND.relMs;
    out.ok=reached&&rok;out.why=!reached?miss:!rok?'Now release it all the way back to the fretted pitch.':'In tune up, back down clean.';return out;}
  if(kind==='bendvib'){if(!reached){out.ok=false;out.why=miss;return out;}const v=vib(r.i0,rel.length-1);
    if(!v||v.dur<700){out.ok=false;out.why='Hold the bent note longer and add vibrato at the top.';return out;}Object.assign(out,{rate:v.rate,width:v.width});
    out.ok=v.rate>=BEND.vibRate[0]&&v.rate<=BEND.vibRate[1]&&v.width>=BEND.bvWidth[0]&&v.width<=BEND.bvWidth[1];out.why=out.ok?'Bent in tune with vibrato on top.':v.width<10?'Bent in tune, but no vibrato on top: keep the bend and rock it.':`Vibrato on the bend: ${v.rate.toFixed(1)} per second, ${Math.round(v.width)} cents wide; aim for 4–8 per second, 15–100 cents.`;return out;}
  out.ok=reached;out.why=reached?`In tune: held ${(r.ms/1000).toFixed(1)} s within ${BEND.tol} cents.`:miss;return out;}
/* the pitch curve against the target band */
function bendSVG(a){if(!a||!a.pts||!a.pts.length)return '';const W=560,H=170,P=34,T=Math.max(1000,a.pts.at(-1).t),lo=Math.min(-60,...a.pts.map(p=>p.c)),hi=Math.max(a.steps+80,...a.pts.map(p=>p.c)),
  X=t=>P+(t/T)*(W-P-10),Y=c=>H-20-(c-lo)/(hi-lo)*(H-34),band=a.kind==='vibrato'?'':`<rect x="${P}" y="${Y(a.steps+BEND.tol)}" width="${W-P-10}" height="${Y(a.steps-BEND.tol)-Y(a.steps+BEND.tol)}" class="bend-band"/>`;
  return `<svg class="bendsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pitch curve">${band}<line x1="${P}" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" class="bend-zero"/>

const STD_SEC={};function stdSeconds(gid){if(STD_SEC[gid]!==undefined)return STD_SEC[gid];const s=STD[gid],ts=[];if(s&&s.flu)GBY[gid].levels.forEach((lv,i)=>{if(!levelFlu(gid,i+1))return;for(const gen of lv.g)for(let k=0;k<3;k++){try{const keep=LAST_ROOT,q=gen();LAST_ROOT=keep;const t=fluTarget(gid,q);if(t)ts.push(t);}catch(e){}}});
  ts.sort((a,b)=>a-b);return STD_SEC[gid]=ts.length?ts[ts.length>>1]*s.flu:null;}
function stdText(gid){const s=STD[gid];if(!s)return '';const p=[`${Math.round(s.acc*100)}% clean over your last ${STD_N}+ answers at each level`];
  if(s.flu){const sec=stdSeconds(gid);p.push(`median clean answer at most ${Math.round(s.flu*100)}% of the unlock target time${s.ex?` (${s.ex})`:sec?` (about ${sec.toFixed(1)} s for a typical question)`:''}`);}
  if(s.gp)p.push(`under ${s.gp.toFixed(1)} s from one played note to the next`);if(s.ab)p.push(`within ${s.ab} ms of the click on timed levels`);return p.join('; ')+': '+s.why+'.';}

const BADGE={scales:['life','core'],tgrips:['warm','core'],tunes:['life','core'],improv:['life','core'],pulse:['life','core'],sight:['life','core'],rhyread:['life','core'],jazzrhy:['life','core'],comping:['life','core'],eardeg:['life','core'],earprog:['life','core'],outer:['life','core'],earmode:['life','core'],sing:['life','core'],cr:['life','core'],arp:['life','core'],repertoire:['life','core'],
 fretboard:['warm','core'],spelling:['warm','core'],triads:['warm','core'],drop2:['warm','core'],shells:['warm','core'],chordscale:['warm','core'],rhytheory:['warm','core'],hunt:['warm','support'],neckiv:['warm','support'],eariv:['warm','support'],earchord:['warm','support'],guidetones:['warm','support'],voicelead:['warm','support'],bends:['warm','side'],walking:['warm','side'],

function gameLearned(gid){const g=G(gid);if(!g.n)return false;return GBY[gid].levels.every((_,i)=>lvStd(gid,i+1).ok);}
function badgeChips(gid,long){const b=BADGE[gid];if(!b)return '';const [k,c]=b,done=gameLearned(gid);return `<span class="badges">${[k,c].map(z=>`<span class="badge b-${z}" title="${BADGE_TXT[z][0]}: ${BADGE_TXT[z][1]}">${BADGE_TXT[z][0]}</span>`).join('')}${done?`<span class="badge b-done" title="every level at the master standard">${k==='once'?'Learned ✓':'At standard ✓'}</span>`:''}</span>${long?`<div class="badgetxt muted">${BADGE_TXT[k][0]}: ${BADGE_TXT[k][1]}. ${BADGE_TXT[c][0]}: ${BADGE_TXT[c][1]}.</div>`:''}`;}
/* the plan: a session cell whose game is learned shows the substitute to play instead — the for-life game of that session's company with the weakest recent accuracy */
function planSub(i,gid){const used=new Set(PLAN[i][1]);const cands=GAMES.filter(x=>BADGE[x.id]&&BADGE[x.id][0]==='life'&&!used.has(x.id));if(!cands.length)return null;const acc=x=>{const g=G(x.id),h=Object.values(g.hist||{}).flat().slice(-40);return h.length?h.reduce((a,b)=>a+b,0)/h.length:0;};return cands.sort((a,b)=>acc(a)-acc(b))[0].id;}
/* Play a session straight through (9 Nov 2026, user: “play these games mindlessly”): one button; the next unticked game of the plan session starts at
   your level with the input it needs, is ticked when you finish a round, and the next one is offered. Nothing to choose. */
let RUN=null;
const runSession=()=>PLAN.findIndex((_,k)=>planTicks(k).filter(Boolean).length<3);
function runStart(i){if(i==null||i<0)i=runSession();if(i<0){RUN=null;return;}const j=planTicks(i).findIndex(v=>!v);if(j<0){RUN=null;view={name:'path'};render();return;}
  let gid=PLAN[i][1][j];if(BADGE[gid]&&BADGE[gid][0]==='once'&&gameLearned(gid)&&planSub(i,gid))gid=planSub(i,gid);
  const x=GBY[gid],g=G(gid);let L=Math.min(g.lvl,x.levels.length);if(!levelAvail(gid,L)&&!x.mic)swapInput(gid);while(L>1&&!levelAvail(gid,L))L--;
  RUN={i,j,gid,ticked:false};start(gid,L);window.scrollTo(0,0);}
function runDone(gid,played){if(!RUN||RUN.gid!==gid||!played)return;STORE.plan=STORE.plan||{};const tk=planTicks(RUN.i).slice();tk[RUN.j]=true;STORE.plan[RUN.i]=tk;saveLocal();RUN.ticked=true;}
function runBar(){if(!RUN)return '';const j=planTicks(RUN.i).findIndex(v=>!v),nx=j>=0?PLAN[RUN.i][1][j]:null;
  return `<div class="banner runbar"><h2>Session ${RUN.i+1} · ${PLAN[RUN.i][0]}</h2><span>${RUN.ticked?`${GBY[RUN.gid].name} ticked. `:''}${nx?`Next: <b>${GBY[nx].name}</b> <button class="btn small primary" data-act="runnext">Continue ▶</button>`:'<b>Session complete.</b>'} <button class="btn small ghost" data-act="runstop">${nx?'Stop here':'Close'}</button></span></div>`;}
function runButton(){const i=runSession();if(i<0)return '';const tk=planTicks(i);return `<div class="runrow"><button class="btn primary big" data-act="runstart">▶ Play session ${i+1} · ${PLAN[i][0]}</button><span class="muted">${PLAN[i][1].map((g,j)=>tk[j]?`<s>${SHORTN[g]||GBY[g].name}</s>`:(SHORTN[g]||GBY[g].name)).join(' → ')} · one round each, at your level, ticked as you go</span></div>`;}
const SHORTN={scales:'Scale Runner',tgrips:'Tension Grips',tunes:'Tunes by Ear',improv:'Improvise',outer:'Bass & Top',earmode:'Modes by ear',analysis:'Analysis',earprog:'Progressions',eardeg:'Degrees',eariv:'Intervals by ear',earchord:'Chords by ear',rhytheory:'Rhythm Theory',rhyread:'Reading Rhythm',neckiv:'Neck Intervals',guidetones:'Guide Tones',voicelead:'Voice Leading',shells:'Shells & Drop-3',chordscale:'Chord–Scale',intervals:'Intervals & Keys',spelling:'Chord Spelling',cr:'Call & Response',bends:'Bends',drop2:'Drop-2',pulse:'Pulse & Feel',jazzrhy:'Jazz Rhythm',hunt:'Note Hunt',sight:'Reading',arp:'Arpeggios',walking:'Walking Line',sing:'Sing It',triads:'Triads',repertoire:'Repertoire',fretboard:'Fretboard',comping:'Comping'};
/* ticks are the user's own: STORE.plan[i] = [bool,bool,bool] per session; nothing is tracked by date */

/* Full notes under each lesson card (9 Nov 2026, user request): the summary stays on top, these go deeper. One entry per game; a section is {h, p:[paragraph | [bullets]]}. */
const LESSON_NOTES={
 fretboard:[
  {h:'How the neck is built',p:['Standard tuning is a stack of perfect 4ths with one major 3rd in it: E–A, A–D, D–G are 4ths (five frets), G–B is a 3rd (four frets), B–E a 4th again. Every shape you learn works unchanged across the 4ths and shifts up one fret when it crosses from G to B. That single irregularity explains every “exception” on the guitar.','The 12th fret repeats the open strings an octave up, so the neck is only twelve frets of information: learn frets 0–11 and you have learned all of it.']},
  {h:'Landmarks, not counting',p:['Counting up from the nut is what makes playing slow. Build a web of anchors instead: the open strings, fret 5 (= the next string open, except G→B at fret 4), fret 7 (= the previous string open, an octave up: fret 7 on string 5 is E, on string 6 is B), fret 12.','Octaves: from strings 6 and 5, two strings up and two frets up; from strings 4 and 3, two strings up and three frets up (the B string shift). Unisons: the same note sits five frets higher on the next lower string (four across G–B).']},
  {h:'A practice order that works',p:[['Strings 6 and 5 first, naturals only: these are the roots of every barre chord, shell voicing and bass line.','Then string 4 (octave of string 6, two frets up) and string 3 (octave of string 5).','Then strings 2 and 1 (string 1 = string 6).','Only then the sharps and flats: one fret up or down from a natural you already know.'],'Say the note aloud before you play it. Naming is the skill; the finger follows.']},
  {h:'What “knowing the neck” means',p:['Under two seconds, any note, any string, without looking for a landmark: that is the fluency target in this game. Past that point the notes stop being positions and become a map you see chord tones, scales and intervals on.']}],
 sight:[
  {h:'The staff for guitar',p:['Guitar music is written in treble clef and sounds an octave lower than written (the clef has an invisible 8 under it). Middle C on the staff is the C on string 5 fret 3 or string 2 fret 1; the open high E is the top space E, the open low E sits three ledger lines below.','Lines bottom to top E G B D F, spaces F A C E. Learn the ledger lines as their own landmarks: C (one below), A (two below), low E (three below); A (one above), C (two above).']},
  {h:'Positions',p:['A position is named for the fret under the index finger: in 2nd position the index covers fret 2, the little finger fret 5. Each position holds every note of a key in a compact fingering; reading in position means the eye sees the note and the hand already has a finger on its fret.','The same written note has several places on the neck. Reading a line is also choosing a position in which the whole phrase lies under the hand without a jump.']},
  {h:'Key signatures while reading',p:['A sharp or flat in the signature applies to every note of that name in every octave until the bar line cancels an accidental. Read the signature as a key first (one sharp = G major or E minor), then as a set of altered notes under the fingers.']},
  {h:'Reading ahead and reading rhythm',p:['Sight reading is reading the next group while playing this one. Read by groups: a scale fragment, an arpeggio, a repeated figure, not note by note.','Pitch without rhythm is not reading. Count the rhythm of the line before the first note, then let the notes fall onto counts you already feel.']}],
 hunt:[
  {h:'One note, everywhere',p:['Every pitch class appears at least once on each string within twelve frets: six spots in all for a note (seven where an open string doubles the 12th fret). Finding them all in order, string by string, is how the neck becomes a map of notes instead of a set of shapes.']},
  {h:'Use the geometry',p:['From one spot, the same note is five frets higher on the next lower string (four across G→B), and an octave is two strings up with the two- or three-fret shift. So from any single spot you can place the other five without naming them again. Name them anyway: the speed comes from both.']},
  {h:'Speed and order',p:['Go low string to high string, lowest fret first. The target in this game is just over a second per spot; the point is not the race but removing the pause before each one. When a spot takes long, that string in that register is a hole in your map: drill it separately.']},
  {h:'In time',p:['Doing it against the click turns knowledge into a reflex: a quarter note per spot forces you to see the next one while playing this one, the same skill you need for reading and for targeting chord tones in a solo.']}],
 triads:[
  {h:'The four qualities',p:['Major 1 3 5, minor 1 ♭3 5, diminished 1 ♭3 ♭5, augmented 1 3 ♯5. The 3rd decides major or minor; the 5th decides the colour (perfect, diminished, augmented). Spell every triad by letters first: a triad uses three consecutive letters of the alphabet, every other one (C E G, D F A).']},
  {h:'Inversions and close voicings',p:['Root position has the root on the bottom, 1st inversion the 3rd, 2nd inversion the 5th. In close position the three notes sit within an octave. On a string set (1–2–3, 2–3–4, 3–4–5, 4–5–6) each inversion is one shape; moving up the neck through the three shapes is the whole triad in that set.','Learn the shapes by the note each finger covers (root, 3rd, 5th), not as a picture. Then changing major to minor is lowering one named finger a fret.']},
  {h:'Voice leading between triads',p:['Chords a 3rd apart share two notes; chords a 4th or 5th apart share one; chords a step apart share none. To move smoothly, keep the common tone and move the other voices by step: C to F keeps C and moves E→F, G→A. The nearest inversion of the next chord is the one that does this.']},
  {h:'What triads are for',p:['Comping without the bass notes (the piano or bass has them), double stops and chord melody, hearing upper structures: a D triad over a C7 is C13♯11. Fluency on all four sets in all keys is the foundation of every jazz voicing you will learn later.']}],
 intervals:[
  {h:'Naming intervals',p:['An interval has a number (count the letters, inclusive: C to E is a 3rd) and a quality. Unisons, 4ths, 5ths and octaves are perfect; 2nds, 3rds, 6ths and 7ths are major or minor. One half step smaller than minor or perfect is diminished; one larger than major or perfect is augmented.','Half steps: m2 1, M2 2, m3 3, M3 4, P4 5, tritone 6, P5 7, m6 8, M6 9, m7 10, M7 11, P8 12. The spelling matters: C–E♭ is a minor 3rd, C–D♯ an augmented 2nd, the same sound.']},
  {h:'Inversion',p:['Inverted intervals add up to 9: a 3rd becomes a 6th, a 2nd a 7th, a 4th a 5th. Major becomes minor, augmented becomes diminished, perfect stays perfect. Use it to spell a falling interval as a rising one.']},
  {h:'Major scales and key signatures',p:['A major scale is W W H W W W H. Sharps enter in the order F C G D A E B (each new sharp is the 7th of the key: one sharp = G, the last sharp a half step below the tonic). Flats enter B E A D G C F; the second-to-last flat names the key (B♭ E♭ = B♭ major), F major has one flat.','Around the cycle of 4ths: C F B♭ E♭ A♭ D♭ G♭ · B E A D G. Knowing the keys by heart in that order is what makes II–V–I in twelve keys possible.']},
  {h:'Minor keys',p:['The relative minor starts on degree 6 of the major (A minor shares C major’s signature); the parallel minor shares the tonic (C minor has three flats). Natural minor is the Aeolian mode; harmonic minor raises the 7th to make V7; melodic minor raises 6 and 7 ascending (classically back to natural descending; in jazz, melodic minor is used both ways).']}],
 spelling:[
  {h:'Formulas',p:['Triads: major 1 3 5, minor 1 ♭3 5, dim 1 ♭3 ♭5, aug 1 3 ♯5. Sevenths: Maj7 1 3 5 7, 7 1 3 5 ♭7, m7 1 ♭3 5 ♭7, m7♭5 1 ♭3 ♭5 ♭7, °7 1 ♭3 ♭5 ♭♭7, m(Maj7) 1 ♭3 5 7, 6 1 3 5 6, m6 1 ♭3 5 6. Sus: sus4 replaces the 3rd with 4, sus2 with 2.','Extensions continue the stack of 3rds: 9 = 2 an octave up, 11 = 4, 13 = 6. Alterations: ♭9 ♯9 ♯11 ♭13. A 13 chord implies the 7th and usually the 9th; a 6 chord does not.']},
  {h:'Spell by letters',p:['Every chord is stacked 3rds, so its letters are every other letter: a C chord uses C E G (B D F A for extensions). Spell the letters first, then fix each with the accidental the formula asks for. That is why C7 has a B♭ and never an A♯, and why an F♯°7 has an E♭ (♭♭7 of F♯ is E♭, not D).']},
  {h:'The cycle and recall',p:['Spelling from a formula is arithmetic; the goal is recall. Majors around the cycle of 4ths first (C F B♭ E♭ A♭ D♭ G♭ B E A D G), then each alteration as one change to a chord you already know: m7 is Maj7 with ♭3 and ♭7; m7♭5 is m7 with ♭5; 7 is Maj7 with ♭7.']},
  {h:'Why speed',p:['In a tune you have a beat to know that the 3rd of E♭7 is G and its 7th D♭. The target here (about two seconds for a triad, three for a seventh chord) is the point where spelling stops being a calculation and the chord tones are simply known.']}],
 drop2:[
  {h:'From close to drop-2',p:['Take a four-note close voicing and drop its second voice from the top an octave: that is drop-2. The result sits on four adjacent strings, which is why it is the guitarist’s voicing. Each close inversion gives one drop-2 inversion, so every seventh chord has four drop-2 shapes on each of the three adjacent string sets (6–3, 5–2, 4–1).','We name them from the close voicing they came from (root position, 1st, 2nd, 3rd inversion), never by the bass note: the bass of a drop-2 is not the bass of its close form.']},
  {h:'Drop-3',p:['Drop the third voice from the top instead and the voicing needs a skipped string: sets 6–4–3–2 and 5–3–2–1. Drop-3 puts the root or 7th alone on the bottom with a wide gap, the sound of Joe Pass and Wes Montgomery’s chord solos.']},
  {h:'Voice leading through II–V–I',p:['Between IIm7 and V7 (and V7 and IMaj7) the 3rd and 7th swap roles: the 7th of Dm7 (C) falls to the 3rd of G7 (B); the 7th of G7 (F) falls to the 3rd of CMaj7 (E). Pick the inversion of each chord that keeps the other voices still and lets those two fall: the whole progression moves by half steps under one hand.']},
  {h:'Melody on top',p:['Chord melody is drop-2 with the melody note as the top voice. For any chord and any melody note that belongs to it, exactly one inversion on a given set puts that note on top; knowing which one, without searching, is the skill the last levels train.']}],
 shells:[
  {h:'What a shell is',p:['Root, 3rd and 7th: the three notes that say which chord it is. The 5th adds nothing to the quality, so the shell is the whole identity of a seventh chord in three notes. In a band the bass plays the root too, which is why two-note guide tones (3 and 7) are often enough.']},
  {h:'The two grips',p:['Root on string 6: root (6), 7th (4), 3rd (3). Root on string 5: root (5), 3rd (4), 7th (3). Learn them for Maj7, 7 and m7 (and m7♭5, which lowers nothing in the shell: the ♭5 is not in it). Every chord in a tune is one of these two grips a fret or two from the last.']},
  {h:'Freddie Green',p:['The Basie rhythm guitar sound is these shells (often just two notes sounding) strummed four to the bar, slightly accented on 2 and 4, strings muted so the attack is more felt than heard. Stay on strings 6–4; the top strings belong to the piano.']},
  {h:'Through II–V–I and the cycle',p:['From a root-6 IIm7 the V7 is a root-5 grip on the same frets; from a root-5 IIm7 the V7 is root-6 two frets lower. Alternating the grips moves a II–V–I with almost no hand movement. The cycle of 4ths in twelve keys is the test: one strum per chord, no gap.']}],
 guidetones:[
  {h:'3 and 7',p:['The 3rd says major or minor, the 7th says Maj7, dominant or m7: together they define the chord. They are the notes a soloist aims at and a comper cannot leave out.']},
  {h:'The guide-tone line',p:['In IIm7–V7–IMaj7 the guide tones fall by half steps: C (7th of Dm7) → B (3rd of G7); F (7th of G7) → E (3rd of CMaj7), while the other note holds (F stays F from Dm7 to G7; B stays B from G7 to CMaj7). Written out, a progression’s guide tones form two slow lines a 3rd or a 6th apart: the skeleton every melody and voicing hangs on.']},
  {h:'In position',p:['Within one position, every chord of a tune has its 3rd and 7th within reach. Marking them chord by chord without moving the hand is the first step to improvising over changes: the line targets a guide tone on beat 1 of each new chord.']}],
 voicelead:[
  {h:'The rules of smooth movement',p:['Keep common tones; move the rest by step, by the smallest interval; let the outer voices move in contrary or oblique motion where possible. Classical part writing forbids parallel 5ths and octaves; jazz voicings relax that, but the sound of a progression that “sings” is still the sound of minimal movement.']},
  {h:'Inversions are the tool',p:['Root-position chords jump; inverted chords connect. The question for every chord is not “what is the chord” but “which inversion puts its notes next to where my fingers already are”. Through a II–V–I that usually means one inversion change per chord and a top voice moving by step.']},
  {h:'The top voice',p:['Listeners hear the highest note as the melody. Plan the top line first (a descending scale fragment, a held note, a step up at the cadence), then find the voicings under it. This is how arrangers and chord-melody players think.']}],
 arp:[
  {h:'Arpeggios are chords in time',p:['Playing the chord tones one after another is the most direct way to spell a chord in a solo. Seventh-chord arpeggios (1 3 5 7) in one position for every quality, from any chord tone, up and down, are the vocabulary; the fluency target is about a second a note at first, then the beat.']},
  {h:'Through the changes',p:['Over IIm7–V7–IMaj7 do not restart on each root: continue the line to the nearest chord tone of the next chord. Dm7 up to C, then B (3rd of G7) down… The guide tones (3 and 7) on the downbeats of chord changes are what make a line sound like it knows the harmony.']},
  {h:'Enclosures and approach notes',p:['Bebop surrounds a chord tone before landing on it: a half step below, a scale step above, then the target. Combined with arpeggios this is most of the bebop language: chord tones on the strong beats, approach notes on the weak ones.']},
  {h:'Rhythm',p:['Swing eighths, accents on the off-beats, phrases that end on an off-beat: an arpeggio with the right rhythm sounds like jazz, a scale with the wrong rhythm does not. Practise with the click on 2 and 4.']}],
 walking:[
  {h:'The job of the line',p:['Four quarter notes a bar that state the root on 1, make the harmony clear, and arrive at the next root on time. Beat 1 is the root (or occasionally the 3rd or 5th); beat 3 is the second strong beat, usually a chord tone (5th most often); beats 2 and 4 pass between them.']},
  {h:'Approaching the next chord',p:['Beat 4 leads into the next root: a half step above or below it (chromatic approach), a scale step, or its 5th (the dominant approach). A good line is heard as a series of arrivals, each root prepared by the note before it.']},
  {h:'Patterns that always work',p:['1–2–3–5, 1–3–5–6, 1–7–6–5 (descending), 1–5–♭6–♭7 into a chord a 4th up, 1 – 3 – 5 – approach. On two-beat chords: root, then approach. Mix them so the line moves in one direction for a while before it turns.']},
  {h:'Range and feel',p:['Strings 6 to 4, roughly E2 to G3: higher and it stops being a bass line. Even quarters, slightly behind the click for a relaxed feel, every note full length (walking is legato).']}],
 neckiv:[
  {h:'Shapes from the tuning',p:['Because the strings are tuned in 4ths (five frets), every interval has one shape: on adjacent strings a P4 is the same fret, a M3 one fret back, a m3 two back, a tritone one up, a P5 two up, a m6 three up, a M6 four up. Two strings up: a m7 is the same fret, a M7 one up, the octave two up, a 9th four up.','Cross from G to B and every shape slides one fret higher (the 3rd between those strings is four frets, not five).']},
  {h:'Below and both directions',p:['Descending intervals are the same shapes read the other way: a 5th down is a 4th up an octave lower; from strings 1–3 you find notes below on strings 4–6. Thinking in both directions is what lets you place any chord tone from any root without moving the hand.']},
  {h:'Tensions as shapes',p:['The 9th is the 2nd a string pair away, the ♯11 the tritone, the 13th the 6th: tensions are not new shapes but familiar intervals an octave up. Learning them from the root this way is how you add colour to a chord or aim a line at a tension on purpose.']},
  {h:'Double stops',p:['Diatonic 3rds alternate major and minor shapes as you move up a scale; diatonic 6ths do the same two strings apart. Those two sets are most of what rhythm-and-blues and country guitar play, and the start of chord-melody.']}],
 chordscale:[
  {h:'One scale per chord',p:['Chord-scale theory assigns each chord a scale that contains its chord tones and the tensions that sound good over it. In a major key: IMaj7 Ionian (Lydian when you want the ♯11), IIm7 Dorian, IIIm7 Phrygian, IVMaj7 Lydian, V7 Mixolydian, VIm7 Aeolian, VIIm7♭5 Locrian. The scale is the chord plus its tensions written as a line.']},
  {h:'Melodic minor and its modes',p:['Melodic minor (1 2 ♭3 4 5 6 7) gives the modern colours: its 4th mode is Lydian dominant (7♯11), its 6th mode Locrian ♮2 (m7♭5 with a natural 9), its 7th mode the altered scale (7alt: ♭9 ♯9 ♯11 ♭13). Over V7 in a minor key, harmonic minor from the 5th (Mixolydian ♭9 ♭13) is the classic choice.']},
  {h:'Symmetric and bebop scales',p:['Half–whole diminished over a dominant with ♭9 (and 13, ♯11); whole–half over °7; whole tone over 7♯5. Bebop scales add one chromatic passing tone so that chord tones fall on the downbeats when you play eighth notes: the dominant bebop scale is Mixolydian plus the natural 7.']},
  {h:'Avoid notes',p:['An avoid note is a scale tone a half step above a chord tone: it can pass through but not be held. Ionian: 4. Mixolydian: 4. Dorian: 6 in a II–V (it is the tritone of V7). Phrygian: ♭2 and ♭6. Aeolian: ♭6. Locrian: ♭2. Lydian has none, which is why it sounds so open.']}],
 analysis:[
  {h:'Diatonic harmony',p:['Major key sevenths: IMaj7 IIm7 IIIm7 IVMaj7 V7 VIm7 VIIm7♭5. The quality tells you the degree: the only dominant seventh in a key is V7, the only m7♭5 is VII. Finding the key of a progression starts from those two.','Function: tonic (I, IIIm, VIm: rest), subdominant (IIm, IV: motion away), dominant (V, VII°: tension that returns to I). A progression is a path through those three.']},
  {h:'Minor keys',p:['Natural minor gives Im7 IIm7♭5 ♭IIIMaj7 IVm7 Vm7 ♭VIMaj7 ♭VII7. Harmonic minor raises the 7th so V becomes V7 (and VII becomes VII°7), which is why minor-key cadences use V7 and IIm7♭5–V7–Im is the minor II–V–I.']},
  {h:'Secondary dominants and substitutes',p:['V7/x is the dominant of a diatonic chord other than I: V7/II (VI7 → IIm7), V7/V (II7 → V7), V7/VI (III7 → VIm7), V7/IV (I7 → IV). The tritone substitute ♭II7 shares the 3rd and 7th of V7 with the roles swapped and puts a half-step bass line under the cadence. The backdoor IVm7–♭VII7–IMaj7 borrows from the parallel minor and resolves up a step.']},
  {h:'Borrowed and passing chords',p:['Modal interchange takes chords from the parallel minor: IVm, ♭VI, ♭VII, IIm7♭5, ♭IIIMaj7. Passing diminished chords fill a step in the bass: ♯I°7 between I and IIm7, ♯II°7 between IIm7 and IIIm7, ♯IV°7 between IV and V (or I/5). Each is a dominant in disguise (♯I°7 = V7♭9/II without its root).']}],
 eardeg:[
  {h:'Functional hearing',p:['After a cadence the key is established and every note has a place: 1 is home, 3 and 5 are stable, 2 4 6 7 want to move. Hearing a degree means hearing that pull, not an interval from the last note. That is what lets you play what you hear in any key.']},
  {h:'Tendency tones',p:['7 leans up to 1 (the leading tone), 4 falls to 3, 6 falls to 5, 2 goes to 1 or 3. In minor, ♭3 is the colour of the key, ♭6 pulls down to 5, and a natural 7 means harmonic minor and V7. The blue notes ♭3 ♭7 ♯4 sit against a major key.']},
  {h:'Method',p:['Sing the tonic from the cadence, then sing stepwise to the note (or from 1 3 5, whichever is nearest). When you can place a note by its pull alone the steps drop away. For two or more notes, anchor on the first one, hear the second as a move from it, then confirm it against home.']},
  {h:'Bass lines and dictation',p:['Hearing the roots of a progression as degrees (1 6 2 5) is this skill applied to the bass; it is how you take down a tune’s changes. Longer melodic dictation is the same: keep the tonic sounding in your head and place each note against it.']}],
 eariv:[
  {h:'Recognising intervals',p:['Rising intervals first: each has a sound you can tie to a tune you know, then let the tunes fall away. Falling intervals are different sounds, not the same ones backwards; learn them separately. Harmonic intervals (both notes at once) are heard as a colour: perfect = hollow, 3rds and 6ths = sweet, 2nds and 7ths = rough, the tritone = unstable.']},
  {h:'Strategy',p:['Sing both notes, then fill in the scale steps between them; or hear the lower note as a tonic and the upper as a degree (a M6 is 1 to 6). Both routes meet in the end: intervals become degrees of an implied key.']},
  {h:'Tensions are intervals',p:['A 9th is a 2nd plus an octave, an 11th a 4th, a 13th a 6th; ♭9 ♯11 ♭13 are the minor 2nd, tritone and minor 6th. Hear the simple interval first, then add the octave: that is how you recognise a tension on top of a chord and how you place one on purpose.']}],
 earchord:[
  {h:'Triads and sevenths',p:['Decide the 3rd first (major or minor), then the 5th (perfect, flat, sharp), then the 7th (major 7th is bright and tense, ♭7 is the dominant sound; a minor 3rd with ♭7 is m7, with a ♭5 as well it is m7♭5). °7 is stacked minor 3rds and sounds the same from every note.']},
  {h:'Sixths, sus and extensions',p:['A 6 chord is a major triad with a soft, resolved colour (no leading-tone tension); sus4 replaces the 3rd and sounds open and unresolved; add9 keeps the 3rd and adds a 2nd. Extensions keep the seventh and stack: 9 is warm, 13 is wide, ♭9 and ♯9 are the altered dominant bite.']},
  {h:'Inversions and voicings',p:['The bass note changes the colour of the same chord: a 1st-inversion triad is lighter, 2nd inversion unstable. Drop-2 voicings spread the notes; learn to hear the top note and the bass separately and the middle fills itself in.']},
  {h:'In context',p:['Qualities are easiest to hear inside a progression because the function predicts them: in a II–V–I the first chord is m7, the second 7, the third Maj7. Use the context to check what the ear reports.']}],
 earprog:[
  {h:'Find the tonic, follow the bass',p:['Hear where the music rests: that is I. Then hear each bass note as a degree from it: the bass line is the numerals. Only then ask about quality (major, minor, dominant). Most progression hearing is bass hearing.']},
  {h:'The common patterns',p:['I–IV–V–I (plain), I–VIm–IV–V (the 50s), I–V–VIm–IV (the pop loop), IIm7–V7–IMaj7 (the jazz cadence), the 12-bar blues (IV in bar 5, V in bar 9, the turnaround in 11–12). Minor: Im–IVm–V7, Im–♭VI–♭III–♭VII, Im–♭VII–♭VI–V7 (the Andalusian line).']},
  {h:'Root motion',p:['Roots move by 4ths (the cycle: jazz and blues), by 3rds (pop and doo-wop, chords sharing two notes), or by steps (rock and modal music). Hearing which kind of motion a tune uses tells you most of its changes before you have named one chord.']},
  {h:'Substitutes and turnarounds',p:['Tritone sub: the bass walks down by half steps (IIm7–♭II7–IMaj7). Backdoor: IVm7–♭VII7 resolving up a step. Secondary dominants: a dominant where a minor chord was expected (I–VI7–IIm7–V7). Turnarounds pack those into two bars and are the hardest to hear at tempo: learn them slow.']}],
 scales:[
  {h:'Seven windows',p:['One major scale has seven fingerings that tile the neck, each with the index finger pinned to one fret: in C they sit at II, III, V, VII, VIII, X and XII. Inside any one of them the whole key is under the hand, so a melody can be read or played there without a shift. Three of them (III, VIII, X) use a one-fret stretch of the fourth finger; that is normal, not a flaw.','Play each from its lowest note to its highest, not from the root: the point is the region, not the scale as a tune.']},
  {h:'Pairs and the circle',p:['The shapes pair up by the finger that holds the root: finger 2 (II and VII), finger 1 (III and VIII), finger 4 (XII and V), and the Dorian pair (V and X, the 2nd degree under finger 1). In each pair one shape has its anchor on the A string and the other on the E string.','Because the E and A strings are a fourth apart, changing from the A-string shape to the E-string shape at the same fret moves the key up a fifth. Round the circle of fifths the hand alternates the two shapes and moves two frets every second key: it never jumps.']},
  {h:'The patterns are the harmony',p:['Thirds, triads and seventh chords played through the scale are the key’s chords laid end to end: C–E–G–B, D–F–A–C, E–G–B–D are IMaj7, IIm7, IIIm7. After this work you see IIm7–V7–IMaj7 inside every position without searching, which is the raw material for improvising over changes.','The alternating versions (one group up, the next down) are where the technique is: they force the string crossings and inside picking that make a line clean or sloppy.']},
  {h:'Modes',p:['The seven modes of a key are the same seven shapes with a different note as home. Play from the mode’s home note to the next one and back and nothing changes under the fingers; play its seventh chords from the home note and the first one is the mode’s own chord (D Dorian gives Dm7, G Mixolydian gives G7).','Only one exercise brings a new shape: keeping one root and changing the mode (C Ionian, C Dorian, C Phrygian…). The home stays put and the parent key, so the shape, moves. That is the version that makes a mode sound like a colour and not like a scale started in an odd place. Hear the chord first; here it is played before you start.']}],
 tgrips:[
  {h:'Derive, do not collect',p:['Every tension chord is a tier-one shape with one note moved. C9 is C7 with the top root raised a whole step; C13 raises it to the 13; C7♭9 lowers the 9 a half step; Cmaj9 and Cm9 do to Maj7 and m7 what C9 does to C7. Learn them as moves and each new chord costs one finger, not a new grip.','Four notes are enough. To make room for a tension drop the 5th first, then the root when a bass player has it.']},
  {h:'Which tension where',p:[['V7 to a major chord: 9 and 13.','V7 to a minor chord: ♭9, ♯9, ♯5 (♭13); stack them and it is the alt chord.','A dominant that does not resolve (the blues, a tritone substitute, a vamp): 9, 13, ♯11.','IIm7: m7, m9, m11. IIm7♭5 stays plain.','Tonic major: Maj7, 6, 6/9, maj9, and maj7♯11 on IV. Tonic minor: m6, m(maj7), m6/9; a m7 there sounds like a II chord.']]},
  {h:'Sus chords',p:['A sus4 chord replaces the 3rd with the 4th: the dominant that has not decided yet. It resolves by letting the 4th fall to the 3rd (C9sus4 to C9), or it stands on its own in modal tunes. A natural 11 never sits on a dominant that still has its 3rd; that clash is exactly what the sus chord avoids.']},
  {h:'A key in one shape family',p:['Take one family (shells on string 6, drop-2 on strings 5 to 2 with the root in the bass) and walk it up the key: IMaj7, IIm7, IIIm7, IVMaj7, V7, VIm7, VIIm7♭5. Only the inner notes change between the four qualities. That is the system behind the fifty grips, and it is how you find any chord of a tune near where your hand already is.']}],
 tunes:[
  {h:'A book of tunes',p:['In Stefan Zweig’s Chess Story a prisoner replays one book of master games until the board is in his head. A musician’s book is tunes: a fixed set, repeated until each one can be played in any key without thought. This game is that book: twenty-four traditional melodies, phrase by phrase, coming round again and again.','They are simple on purpose. The moves in them (steps along the scale, leaps inside the tonic chord, a return home) are the moves of every melody, a jazz standard included.']},
  {h:'How to hear a phrase',p:['Do not hunt note by note. Hear the phrase as a shape: where it starts against the key, where it turns, where it ends. Sing it once. Find the first note; the rest follows from the intervals you already know.','The first note is nearly always 1, 3 or 5. The last note tells you whether the phrase rests (1, 3, 5) or leans forward (2, 7).']},
  {h:'Think in degrees',p:['A tune is its degrees, not its letter names: Ode to Joy is 3 3 4 5 5 4 3 2 in every key. Playing a tune in a new key is reading the same numbers from a new 1. That is why the later levels change key every time, and why the last level gives you only the name.']},
  {h:'What is not here',p:['The melodies of jazz standards are under copyright and are not in the book. Learn those from recordings: the skill this game builds is exactly the one you need for that. The changes of the standards are in Repertoire.']}],
 improv:[
  {h:'What makes a line work',p:['A line states the harmony when its strong beats carry chord tones. In 4/4 the strong beats are 1 and 3; in eighth notes, every beat. Everything between is passing: scale steps, or chromatic notes that resolve by half step into a chord tone.','That is the whole grammar of bebop lines, and it is what this game checks. There is no right answer, only lines that keep the rules.']},
  {h:'Guide tones',p:['The 3rd and 7th define a chord. Through a II–V–I the 7th of each chord falls a half step (or a whole step) to the 3rd of the next: C to B over Dm7–G7, F to E over G7–CMaj7. Aim at one of them on beat 1 of every bar and your line follows the changes by itself.']},
  {h:'Scales and approach notes',p:['Each chord has a scale: Dorian for IIm7, Mixolydian for V7, major for IMaj7; in minor, Locrian for IIm7♭5 and the harmonic minor of the key over V7♭9. Between two chord tones, walk the scale.','A chromatic approach is a note outside the scale that moves a half step into the next note. It is allowed anywhere it resolves; left hanging, it is a wrong note.']},
  {h:'From rules to music',p:['Start with the one line that always works (3rd on beat 1, up the scale), then vary one note, then the direction, then the starting tone. Sing what you are about to play. When the rules are automatic you stop hearing them and start hearing phrases: that is the point at which Call & Response, Tunes by Ear and this game become the same skill.']}],
 outer:[
  {h:'Soprano and bass',p:['Listeners hear the outer voices first: the bass tells them the chords, the top voice is the melody. Training the ear on those two lines, separately and together, is how you follow a song you have never seen and how you arrange one.']},
  {h:'The bass as degrees',p:['Most of the time the bass is the root, so the bass line as scale degrees is the numerals of the progression. When the bass is not the root you hear an inversion: a lighter, moving sound. Hum the lowest note of each chord before you name it.']},
  {h:'The top note, twice',p:['Name the top note as a degree of the key (that is the melody) and as what it is to its chord (3rd, 7th, 9th…). Chord tones on top sound settled, tensions float. A 9th is a 2nd above the root plus an octave: hearing tensions as intervals from the bass is the whole trick.']},
  {h:'Polarity',p:['When bass and melody move in opposite directions a progression sounds strong; when they move together it sounds thin. That contrary motion is what arrangers mean by soprano–bass polarity, and it is why the same four chords can sound inevitable in one song and flat in another.']}],
 earmode:[
  {h:'Modes are colours',p:['The seven modes of the major scale share the same notes; what you hear is where home is and which note is “out of place” for plain major or minor. Major-type: Ionian (plain), Lydian (♯4), Mixolydian (♭7). Minor-type: Aeolian (plain), Dorian (natural 6), Phrygian (♭2). Locrian has ♭2 and ♭5 and no stable 5th.']},
  {h:'The colour note',p:['Each mode has one degree that tells it from the others: Lydian ♯4, Mixolydian ♭7, Dorian 6, Phrygian ♭2, Aeolian ♭6, Ionian 7 (against Mixolydian), Locrian ♭5. First decide major or minor 3rd, then hunt for that one note; the rest of the scale is the same.']},
  {h:'Vamps and borrowed chords',p:['Two chords are enough to set a mode: Im7–IV7 is Dorian, I7–♭VII Mixolydian, IMaj7–II Lydian, Im–♭II Phrygian. In a major-key progression one chord from the parallel minor (IVm, ♭VII, ♭VI, IIm7♭5, ♭III) darkens the colour for a bar: hearing which chord did it and which note it brought (♭6, ♭7, ♭3) is hearing modal interchange.']},
  {h:'Melodic-minor modes',p:['The same game over melodic minor: melodic minor itself (minor with a natural 6 and 7), Lydian dominant (Mixolydian ♯4), Locrian ♮2, and the altered scale (every tension flattened or sharpened over a dominant). These are the sounds of modern jazz lines over 7♯11, m7♭5 and 7alt.']}],
 sing:[
  {h:'Why sing',p:['Singing is the proof that you hear a note before you play it. The voice cannot fake a degree the way a finger can: if you can sing 6 after a cadence, you own it; if not, the ear is still guessing.']},
  {h:'Intonation',p:['Match pitch to within a few cents: sing into the note, hold it, let it settle. Sing the tonic first every time, then the degree. In minor, feel ♭3 as the key’s colour and ♭6 falling to 5. Chromatic degrees are leaning notes: sing where they want to go, then the note itself.']},
  {h:'Intervals, chord tones, lines',p:['Singing an interval above a given note, or the 3rd and 7th of a chord you hear, is the direct route to hearing harmony from the inside. Guide-tone lines through a II–V–I sung slowly are worth more than an hour of scales.']},
  {h:'Breath and vowel',p:['Use an open vowel (“ah” or “oo”), sing softly, breathe before the phrase. Pitch wobbles when the breath runs out; shorter phrases, sung well, train the ear faster.']}],
 cr:[
  {h:'Hear, then play',p:['Call and response is transcription at speed: hear a phrase, hold it in the ear, find it on the guitar. Catch the first note and the contour first (up, down, where it turns); the exact intervals come after. Singing the phrase back silently before playing it halves the errors.']},
  {h:'Chunking',p:['A phrase is two or three gestures, not eight separate notes: a scale fragment, a leap, a turn. Hear it in those chunks and the notes come as groups.']},
  {h:'In time and in the blues',p:['Playing the phrase back on the click adds the real constraint: the rhythm of the answer matters as much as its notes. Blues phrases live on the ♭3, ♭7 and ♯4 against the chord; double stops (3rds and 6ths) are heard as one sound and answered as one.']},
  {h:'Longer phrases',p:['Two bars over a II–V: hear where the phrase targets the chord change (usually a guide tone on beat 1), memorise the target, then fill the approach. That is how players learn solos from records.']}],
 bends:[
  {h:'Pitch is the point',p:['A bend is a note, not an effect: a whole-step bend from G reaches A exactly, and the ear hears the miss long before the hand does. Fret the target note first and listen; then bend to it; check with the fretted note again.']},
  {h:'Technique',p:['Bend with the ring finger supported by the middle and index behind it; the power comes from turning the wrist, not pushing with the fingertip. Mute the strings you are not playing with the picking hand and the fretting thumb so only the bent note rings.']},
  {h:'Release, pre-bend, vibrato',p:['A release comes back all the way to the fretted pitch, in tune, without a bump. A pre-bend reaches the pitch silently and releases down to the note. Vibrato is a controlled, even bend and release around the pitch: decide its width (a quarter tone, a half step) and its speed, and keep both steady; wide and slow is a blues voice, narrow and quick a classical one.']},
  {h:'Reading your curve',p:['The pitch curve after each take shows it all: a flat top means you held the pitch, a slope means you never settled, a bump on the release means the finger let go unevenly.']}],
 repertoire:[
  {h:'Forms, not tunes',p:['Jazz repertoire is a small number of forms with many tunes on each. Know the form and you know where you are in any of them: the 12-bar blues, the minor blues, the Bird blues, rhythm changes, and the 32-bar AABA and ABAC song forms.']},
  {h:'The blues',p:['Basic: I7 for four bars, IV7 for two, I7 for two, V7, IV7, I7, V7 (turnaround). Quick change puts IV7 in bar 2. Jazz blues adds ♯IV°7 in bar 6, VI7 in bar 8, IIm7–V7 in bars 9–10 and a I–VI7–IIm7–V7 turnaround. The minor blues uses Im7, IVm7, and a ♭VI7–V7 cadence in bars 9–10. The Bird blues replaces most bars with chains of II–V’s.']},
  {h:'Rhythm changes',p:['AABA in B♭. The A is built on I–VI7–IIm7–V7 turnarounds, with the bridge to IV in bars 5–6 (I7–IV7–♯IV°7 back to I). The B section is a cycle of dominants: III7 – VI7 – II7 – V7, two bars each. Hundreds of bebop tunes sit on it.']},
  {h:'Playing the changes',p:['A tune is learned when you can play its chords in time with any voicing: shells, drop-2, triads, without stopping. Knowing what comes next, from any bar, is the same test. The melody and the recordings stay yours to learn by ear; the app grades the changes.']}],
 pulse:[
  {h:'Subdivision',p:['Time is kept by the smallest value you can feel, not by the beat: count 1 & 2 & for eighths, 1 trip-let for triplets, 1 e & a for sixteenths, out loud until it is inside. Switching subdivisions without the tempo drifting is the first real test.']},
  {h:'The click on 2 and 4',p:['Jazz musicians set the metronome on 2 and 4 so the click is the hi-hat, not the downbeat. You supply 1 and 3. Then 4 only, then the and of 4, then nothing for eight bars: each step takes the click away and leaves your clock.']},
  {h:'Swing and feel',p:['Swing eighths are long–short, about 2:1 at medium tempos and straighter as the tempo rises. Time feel is where you sit against the click: dead centre, a little ahead (urgent, bebop), a little behind (relaxed, blues and ballads). It is a choice, so practise all three on purpose. Where you sit is shown here as Lean and not judged; what is judged is steadiness around your own placement.']},
  {h:'Dynamics',p:['A rhythm is defined as much by its accents as its attacks: beat 1, the backbeat on 2 and 4, the push on the and of 4. A keyboard cannot show how hard you play; the mic can, which is why the accent levels listen to your strum. Make the strong beats clearly louder and the weak ones even.']}],
 rhyread:[
  {h:'Reading by counting',p:['Say the counts under the notes before you play: a quarter is one count, two eighths are “1 &”, a dotted quarter plus an eighth is “1 (2) &”. A tie adds the next value without a new attack; a dot adds half the value. Rests are counted with the same syllables, silently.']},
  {h:'The order of figures',p:['Leavitt’s order: whole, half and quarter notes with their rests; eighths; dotted quarter and eighth; ties across beats; sixteenths and their combinations; triplets; then syncopation (attacks on the off-beats held through the beat). Each new figure is read in every position of the bar before the next one comes.']},
  {h:'Long notes',p:['A half note is a two-beat sound, not a quarter followed by a gap: hold it (on the keyboard, keep the key down; with the voice, sing the vowel through it) and release before the rest. Reading rests correctly is reading.']},
  {h:'Eight bars at a time',p:['The etude levels read continuous lines: the eye must stay a bar ahead of the hand. If you lose the place, keep the count going and come back in on the next bar line rather than stopping.']}],
 rhytheory:[
  {h:'Values and meter',p:['A whole note is four quarters, a half two, an eighth half a quarter, a sixteenth a quarter of one; a dot adds half the value, a tie joins two values. The time signature says how many beats per bar and which note gets one beat: 4/4 four quarters, 3/4 three, 6/8 two dotted-quarter beats (compound meter: the beat divides in three).']},
  {h:'Counting systems',p:['Eighths: 1 & 2 & 3 & 4 &. Sixteenths: 1 e & a. Triplets: 1 trip-let (or 1 ta ta). Compound meter in 6/8: 1 2 3 4 5 6 felt as two. Name the count a note falls on and you can place any figure.']},
  {h:'Beaming and notation',p:['Beam notes in groups that show the beat: four sixteenths under one beam, eighths in pairs in 4/4, three eighths per beam in 6/8. Syncopation is written to show where the beats are (ties across a beat rather than a value that hides it). Swing is written as straight eighths and marked “swing” at the top.']},
  {h:'Dictation',p:['Count the clicks, mark where attacks fall between them, then write values that add up to the bar: a note lasts until the next attack or rest. The written length is what you heard sustained; a sound that stops early is a rest.']}],
 jazzrhy:[
  {h:'The Charleston and the push',p:['The Charleston figure is a dotted quarter and an eighth (beat 1 and the and of 2), the basic unit of swing comping and of countless melodies. A push (anticipation) attacks a chord or note an eighth early, on the and of 4 or the and of 2, and holds it through the beat.']},
  {h:'Dotted chains and triplets',p:['Chains of dotted quarters put a three-beat pattern against the four-beat bar: the hemiola, which resolves after three bars. Quarter-note triplets stretch three notes over two beats; feel them as the down-beats of eighth-note triplets.']},

     ${n.goal?`<p class="note" style="margin-top:12px">Not playable yet: this is where the tracks lead. ${s.st==='ready'?'You have every skill it needs.':''}</p>`:`<div class="tablewrap" style="margin-top:12px"><table class="sk-lvtab"><thead><tr><th>Level</th><th class="n">Played</th><th class="n">Clean</th><th class="n">Speed / timing</th><th></th></tr></thead><tbody>${s.inf.map(x=>`<tr class="sk-game"><td colspan="5">${GBY[x.gid].name}<div class="sk-stdtxt">Standard: ${stdText(x.gid)}</div></td></tr>`+Array.from({length:x.n},(_,i)=>x.a+i).map(L=>{const m=lvMetrics(x.gid,L),bs=metricBits(m,stdOf([x.gid])),ps=lvPassed(x.gid,L),op=lvOpen(x.gid,L),cur=L===G(x.gid).lvl,at=lvStd(x.gid,L).ok;const acc=m.rn?bs[0]:null,sp=bs.find(b=>/time|ms|note|avg/.test(b.t));
